function person({ skin, top, bottom, hair, girl }) {

  for (const s of [-1, 1]) { const c = add(new THREE.SphereGeometry(0.035, 10, 8), std(0xd8806a, { roughness: .6, transparent: true, opacity: .5 }), s * 0.16, -0.07, 0.22, head); c.scale.z = 0.4; }

  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), skinM); hand.position.set(0, 0, 0.55); ra.add(hand);
