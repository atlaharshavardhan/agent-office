<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const Q = new URLSearchParams(location.search);
if (Q.get('zones') === '1') document.getElementById('zones').style.display = 'block';

const W = innerWidth, H = innerHeight, ASPECT = W / H;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);

const scene = new THREE.Scene();
// night sky gradient
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#060a1a'); gr.addColorStop(.55, '#0e1838'); gr.addColorStop(1, '#1c2350');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);

}

// ---------- camera: isometric orthographic ----------
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 400);
const ISO = new THREE.Vector3(1, 0.82, 1).normalize();
function setCam(target, viewW) {

  cam.left = -viewW / 2; cam.right = viewW / 2; cam.top = vh / 2; cam.bottom = -vh / 2;
  cam.position.copy(target).addScaledVector(ISO, 120); cam.lookAt(target); cam.updateProjectionMatrix();
}

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x7f8fd0, 0x4a3530, 0.75));
const moon = new THREE.DirectionalLight(0xaabbff, 0.7);
moon.position.set(-30, 50, 20); moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048); Object.assign(moon.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 150 });
moon.shadow.bias = -0.0005; scene.add(moon);
const fill = new THREE.DirectionalLight(0xffd8b0, 0.35); fill.position.set(40, 30, 40); scene.add(fill);

// ---------- helpers ----------
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, metalness: 0, ...o });
function box(w, h, d, mat, x, y, z, r = 0.12) {
  const m = new THREE.Mesh(r ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}

// ---------- ground diorama tile ----------
box(36, 1.6, 36, std(0x1b2238), 0, -0.8, 0, 0.6);           // base
box(35.2, 0.12, 35.2, std(0x2a3150), 0, 0.02, 0, 0.05);       // pavement
const roadMat = std(0x161a28, { roughness: .95 });
box(35.2, 0.06, 7, roadMat, 0, 0.1, -1.5, 0);                 // road along x (in front of block A)
box(7, 0.065, 35.2, roadMat, -1.5, 0.1, 0, 0);                // road along z (in front of block B)
const dash = std(0xe8e4d0, { emissive: 0x555040, emissiveIntensity: .4 });
for (let i = -16; i <= 16; i += 3) { if (Math.abs(i + 1.5) > 4) { box(1.4, 0.03, 0.18, dash, i, 0.15, -1.5, 0); box(0.18, 0.03, 1.4, dash, -1.5, 0.15, i, 0); } }
// zebra crossing
for (let k = 0; k < 6; k++) box(0.5, 0.03, 2.6, dash, 3.2 + k * 0.9, 0.15, -1.5, 0);

// ---------- apartment block ----------
const winLit = new THREE.MeshStandardMaterial({ color: 0x2a2010, emissive: 0xffb347, emissiveIntensity: 1.1, roughness: .4 });
const winWarm = new THREE.MeshStandardMaterial({ color: 0x2a2010, emissive: 0xffd9a0, emissiveIntensity: .7, roughness: .4 });
const winDark = new THREE.MeshStandardMaterial({ color: 0x1a2440, roughness: .25, metalness: .3 });
const frameMat = std(0x30303a);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// facade faces +z (axis 'z') or +x (axis 'x')
function block({ x0, x1, z0, z1, floors, color, axis, featured }) {
  const fh = 3.2, h = floors * fh, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  const wallMat = std(color, { roughness: .85 });
  box(x1 - x0, h, z1 - z0, wallMat, cx, h / 2, cz, 0.25);
  box(x1 - x0 + 0.4, 0.5, z1 - z0 + 0.4, std(0xd8d2c4), cx, h + 0.25, cz, 0.12);   // parapet
  // rooftop water tanks (Indian roofs) + dish
  const tankMat = std(0x1c1c22, { roughness: .6 });
  for (const [dx, dz] of [[-2, -2], [1.5, -2.5]]) {
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.5, 24), tankMat);
    t.position.set(cx + dx, h + 1.25, cz + dz); t.castShadow = true; scene.add(t);
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16), tankMat); lid.position.set(cx + dx, h + 2.1, cz + dz); scene.add(lid);
  }
  const dish = new THREE.Mesh(new THREE.SphereGeometry(0.7, 20, 10, 0, Math.PI * 2, 0, 1.0), std(0xe6e6ea, { side: THREE.DoubleSide }));
  dish.position.set(cx + 2.5, h + 1.0, cz + 1.5); dish.rotation.set(-0.9, 0.6, 0); scene.add(dish);
  // floor bands + windows on the facade
  const len = axis === 'z' ? x1 - x0 : z1 - z0, cols = Math.floor(len / 2.6);
  const out = axis === 'z' ? z1 : x1;
  const put = (m, along, y, off) => { if (axis === 'z') m.position.set(x0 + along, y, out + off); else { m.position.set(out + off, y, z1 - along); m.rotation.y = Math.PI / 2; } scene.add(m); return m; };
  for (let f = 0; f < floors; f++) {
    const band = new THREE.Mesh(new THREE.BoxGeometry(len, 0.22, 0.25), std(0xe9e3d5)); band.castShadow = true;
    put(band, len / 2, f * fh + 0.11, 0.1);
    for (let c = 0; c < cols; c++) {
      const along = (c + 0.5) * len / cols, y = f * fh + 1.75;
      if (featured && featured.floor === f && featured.col === c) continue;
      const fr = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.7, 0.12), frameMat); put(fr, along, y, 0.04);
      const r = rnd(); const pane = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.5, 0.08), r < .38 ? winLit : r < .58 ? winWarm : winDark);
      put(pane, along, y, 0.1);
      const sill = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.12, 0.35), std(0xe9e3d5)); put(sill, along, y - 0.9, 0.18);
    }
  }
  // featured balcony with an open, lit door
  if (featured) {
    const along = (featured.col + 0.5) * len / cols, fy = featured.floor * fh;
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.5, 0.08), new THREE.MeshStandardMaterial({ color: 0x2a2010, emissive: 0xffc070, emissiveIntensity: 1.25 }));
    put(door, along, fy + 1.45, 0.06);
    const slab = new THREE.Mesh(new RoundedBoxGeometry(3.2, 0.25, 1.6, 2, 0.06), std(0xe9e3d5)); slab.castShadow = slab.receiveShadow = true;
    put(slab, along, fy + 0.15, 0.8);
    const glass = new THREE.MeshPhysicalMaterial({ color: 0x9fd0ff, transparent: true, opacity: .22, roughness: .05, metalness: 0 });
    const rail = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.0, 0.06), glass); put(rail, along, fy + 0.8, 1.58);
    const top = new THREE.Mesh(new THREE.BoxGeometry(3.25, 0.08, 0.1), std(0xc9ccd6, { metalness: .8, roughness: .3 })); put(top, along, fy + 1.32, 1.58);
    for (const s of [-1, 1]) { const side = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.0, 1.6), glass); put(side, along + s * 1.6, fy + 0.8, 0.8); }
    const lamp = new THREE.PointLight(0xffb060, 3.5, 7, 1.6); put(lamp, along, fy + 2.2, 0.35);
    // world position of balcony centre
    return axis === 'z' ? new THREE.Vector3(x0 + along, fy + 0.27, out + 0.8) : new THREE.Vector3(out + 0.8, fy + 0.27, z1 - along);
  }
}

const balA = block({ x0: 2.5, x1: 15.5, z0: -15, z1: -6, floors: 5, color: 0xe0895a, axis: 'z', featured: { floor: 2, col: 1 } });
const balB = block({ x0: -15, x1: -6, z0: 2.5, z1: 15.5, floors: 5, color: 0x58a89c, axis: 'x', featured: { floor: 2, col: 3 } });
// background block (behind, for depth)
block({ x0: -15, x1: -6, z0: -15, z1: -6, floors: 6, color: 0x7a6a9a, axis: 'z' });

// ---------- street props ----------
function streetLamp(x, z, rotY) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 5.2, 10), std(0x2c3040, { metalness: .6, roughness: .4 }));
  pole.position.set(x, 2.6, z); pole.castShadow = true; scene.add(pole);
  const arm = new THREE.Group(); arm.position.set(x, 5.1, z); arm.rotation.y = rotY; scene.add(arm);
  const a = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.09, 0.09), pole.material); a.position.x = 0.6; arm.add(a);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.12, 0.3), new THREE.MeshStandardMaterial({ color: 0xffe2a8, emissive: 0xffc46b, emissiveIntensity: 2 })); head.position.set(1.15, -0.06, 0); arm.add(head);
  const l = new THREE.PointLight(0xffb45a, 45, 14, 1.6); l.position.set(1.15, -0.4, 0); arm.add(l);
}
streetLamp(7, 3.2, Math.PI);
streetLamp(3.2, 9, Math.PI / 2);
function tree(x, z, s = 1) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * s, 0.2 * s, 1.6 * s, 8), std(0x4a3426)); trunk.position.set(x, 0.8 * s, z); trunk.castShadow = true; scene.add(trunk);
  const leafMat = std(0x2f6b4a, { roughness: .9 });
  for (const [dx, dy, dz, r] of [[0, 2.2, 0, 1.15], [0.6, 1.9, 0.3, .8], [-0.5, 2.0, -0.3, .85], [0.1, 2.8, -0.1, .75]]) {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, 1), leafMat); b.position.set(x + dx * s, dy * s, z + dz * s); b.castShadow = true; scene.add(b);
  }
}
tree(12, 4); tree(5, 13, .9); tree(14, 13, 1.1); tree(-4.5, -11, .8);
// parked scooter (simple)
{
  const g = new THREE.Group(); g.position.set(10, 0.15, 6.2); g.rotation.y = 0.4; scene.add(g);
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.5, 0.55, 0.5, 2, 0.18), std(0xe04848, { roughness: .4 })); body.position.y = 0.6; g.add(body);
  for (const sx of [-0.6, 0.6]) { const w = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.09, 8, 18), std(0x111111)); w.position.set(sx, 0.3, 0); g.add(w); }
  const seat = new THREE.Mesh(new RoundedBoxGeometry(0.7, 0.14, 0.42, 2, 0.06), std(0x1a1a1a)); seat.position.set(-0.2, 0.95, 0); g.add(seat);
  g.traverse(o => o.castShadow = true);
}

// ---------- people ----------
function person({ skin, top, bottom, hair, girl, torch: hasTorch = true }) {
  const g = new THREE.Group();
  const skinM = std(skin, { roughness: .55 }), topM = std(top, { roughness: .7 }), botM = std(bottom, { roughness: .8 }), hairM = std(hair, { roughness: .85, metalness: 0 });
