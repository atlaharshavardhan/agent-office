<title>Pulse Light Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* 1080x1920 Short scene: how the band reads your pulse. Side-on slice of the wrist, dense green light paths,
   then the "flicker" signal (one dot per reading, 26 a second) and the timing between beats.
   Reel safe zones: title 220-450, subject 450-1500 (kept above 1250 for subtitles), nothing right of 940 below 1100. */
:root { --bg: #050607; --fg: #f2f4f6; --green: #4be08a; --red: #ff4d5e; --muted: #9aa4ad; --line: rgba(160,180,195,.18); color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#stage { position: fixed; left: 50%; top: 50%; width: 1080px; height: 1920px; transform: translate(-50%, -50%) scale(var(--k, 1)); background: var(--bg); overflow: hidden; font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--fg); }
#c { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
#fade { position: absolute; left: 0; right: 0; top: 1130px; height: 790px; background: linear-gradient(rgba(5,6,7,0), #050607 130px); }
#dim { position: absolute; inset: 0; background: rgba(4,5,6,.86); opacity: 0; }
#title { position: absolute; left: 80px; right: 80px; top: 250px; text-align: center; font: 700 76px/1.08 Sora, sans-serif; letter-spacing: -0.02em; text-wrap: balance; }
#title em { font-style: normal; } #title .g { color: var(--green); } #title .r { color: var(--red); }
#illus { position: absolute; left: 0; right: 0; top: 452px; text-align: center; font: 400 26px "IBM Plex Sans", sans-serif; color: rgba(220,226,232,.55); }
#legend { position: absolute; left: 70px; top: 1160px; font: 600 30px "IBM Plex Sans"; color: rgba(160,255,200,.85); letter-spacing: .02em; opacity: 0; }
.pill { position: absolute; left: 0; top: 0; padding: 12px 24px; border-radius: 999px; font: 600 34px "IBM Plex Sans", sans-serif; background: rgba(10,12,14,.84); border: 2px solid rgba(255,255,255,.18); white-space: nowrap; transform: translate(-50%, -50%); opacity: 0; }
.pill.g { border-color: rgba(75,224,138,.7); color: #d9ffe8; } .pill.r { border-color: rgba(255,77,94,.7); color: #ffe0e4; }
#gc { position: absolute; left: 40px; top: 520px; width: 920px; height: 720px; opacity: 0; }
#phone { position: absolute; left: 330px; top: 500px; width: 420px; height: 730px; border-radius: 56px; background: #0b0d10; border: 3px solid #2a2f35; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 8px #050607; opacity: 0; overflow: hidden; }
#phone .notch { position: absolute; left: 50%; top: 22px; width: 120px; height: 30px; margin-left: -60px; border-radius: 20px; background: #000; }
#phone .lbl { position: absolute; left: 40px; top: 96px; font: 500 28px "IBM Plex Sans"; color: var(--muted); }
#phone .bpm { position: absolute; left: 40px; top: 140px; font: 700 168px/1 Sora; letter-spacing: -0.04em; }
#phone .unit { position: absolute; left: 44px; top: 318px; font: 600 34px "IBM Plex Sans"; color: var(--red); }
#phone .heart { position: absolute; right: 44px; top: 170px; width: 70px; height: 70px; }
#phone canvas { position: absolute; left: 24px; top: 400px; width: 372px; height: 170px; }
#phone .foot { position: absolute; left: 40px; right: 40px; top: 600px; font: 400 25px/1.35 "IBM Plex Sans"; color: var(--muted); }
#wm { position: absolute; right: 18px; top: 960px; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: .8; }
#wm img { width: 70px; height: 70px; border-radius: 50%; }
#wm span { writing-mode: vertical-rl; font: 600 27px "IBM Plex Sans", sans-serif; color: rgba(255,255,255,.85); letter-spacing: .04em; }
#wm2 { position: absolute; left: 0; top: 0; font: 600 40px "IBM Plex Sans"; color: rgba(255,255,255,.06); white-space: nowrap; pointer-events: none; }
#zones { position: absolute; inset: 0; pointer-events: none; display: none; }
body.zones #zones { display: block; }
</style>

<div id="stage">
  <canvas id="c" aria-label="Side view of a wrist under a fitness band: green light fans into the skin, blood absorbs some of it, and the returning light flickers with every heartbeat."></canvas>
  <div id="fade"></div>
  <div id="dim"></div>
  <div id="title"></div>
  <div id="illus">Illustrative · not to scale</div>
  <div id="legend">Light shown in green</div>
  <div class="pill g" id="pLed">Green LED</div>
  <div class="pill g" id="pPd">Light sensors</div>
  <div class="pill r" id="pArt">Blood vessel</div>
  <canvas id="gc" width="920" height="720"></canvas>
  <div id="phone">
    <div class="notch"></div>
    <div class="lbl">Heart rate</div>
    <div class="bpm">72</div>
    <div class="unit">beats per minute</div>
    <svg class="heart" viewBox="0 0 24 24"><path fill="#ff4d5e" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.8 6.6 4.8c2.1 0 3.6 1.2 5.4 3.3 1.8-2.1 3.3-3.3 5.4-3.3 3.6 0 5.7 3.6 4.2 7-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg>
    <canvas id="pc" width="372" height="170"></canvas>
    <div class="foot">One dip in the light = one heartbeat. Dips per minute = your heart rate.</div>
  </div>
  <div id="wm2"><span>@TheInvisiTech</span></div>
  <div id="wm"><img src="../airpods-ear/assets/invisitech-logo.png" alt=""><span>@TheInvisiTech</span></div>
  <svg id="zones" viewBox="0 0 1080 1920" width="1080" height="1920">
    <rect x="0" y="0" width="1080" height="220" fill="rgba(255,0,0,.18)"/><rect x="0" y="1500" width="1080" height="420" fill="rgba(255,0,0,.18)"/>
    <rect x="940" y="1100" width="140" height="400" fill="rgba(255,0,0,.18)"/>
    <rect x="0" y="220" width="1080" height="230" fill="none" stroke="#ff0" stroke-width="3"/><rect x="0" y="1250" width="1080" height="200" fill="none" stroke="#0ff" stroke-width="3"/>
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search), RENDER = Q.has('render');
if (Q.has('zones')) document.body.classList.add('zones');
const W = 1080, H = 1920;
const stageEl = document.getElementById('stage');
function fit() { stageEl.style.setProperty('--k', Math.min(innerWidth / W, innerHeight / H)); }
addEventListener('resize', fit); fit();

/* ---------------- renderer + scene: dark, key + rim lights ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: RENDER });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x050607);
const camera = new THREE.PerspectiveCamera(30, W / H, 1, 2000);
const key = new THREE.SpotLight(0xfff1e0, 1.3, 0, 0.5, 0.9, 0); key.position.set(20, 260, 140); key.target.position.set(0, -10, 0); scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xcfe0ff, 0.8); rim.position.set(-250, 60, -100); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xffd2a8, 0.45); rim2.position.set(260, 40, -40); scene.add(rim2);
const front = new THREE.DirectionalLight(0xffffff, 0.22); front.position.set(0, 20, 300); scene.add(front);
(function env() {
  const es = new THREE.Scene(); es.add(new THREE.Mesh(new THREE.BoxGeometry(120, 70, 120), new THREE.MeshBasicMaterial({ color: 0x15181c, side: THREE.BackSide })));
  const panel = (w, h, k, x, y, z, ry = 0, rx = 0) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffffff).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); es.add(m); };
  panel(60, 30, 2.2, 0, 34, 0, 0, Math.PI / 2); panel(120, 8, 1.4, 0, 6, -59); panel(8, 40, 2.4, -58, 8, 0, Math.PI / 2); panel(8, 40, 1.8, 58, 8, 0, Math.PI / 2);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.02).texture; pm.dispose();
})();

/* ---------------- helpers ---------------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvasTex(w, h, draw, srgb = true) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); const t = new THREE.CanvasTexture(cv); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }
function rrShape(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; r = Math.min(r, w / 2, h / 2);
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0); s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI); s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5); return s; }
function pillow(w, l, r, h, bev) { const d = Math.max(h - 2 * bev, 0.01); const g = new THREE.ExtrudeGeometry(rrShape(w - 2 * bev, l - 2 * bev, Math.max(r - bev, 0.2)), { depth: d, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 4, curveSegments: 24 }); g.translate(0, 0, -d / 2); g.rotateX(-Math.PI / 2); return g; }
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const clamp01 = t => Math.min(1, Math.max(0, t));
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const glowTex = canvasTex(128, 128, (x, w, h) => { const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); });

/* ---------------- skin slice (dark, muted tissue so the green light reads) ---------------- */
const BX = 110, BZ = 30, EPI = 4, DER = 30, FAT = 52;   // layer depths (illustrative)
function layerTex(kind) {
  return canvasTex(1024, 256, (x, w, h) => {
    const r = rng(kind.length * 7);
    if (kind === 'epi') { x.fillStyle = '#5a3e33'; x.fillRect(0, 0, w, h); for (let i = 0; i < 30; i++) { x.strokeStyle = `rgba(${130 + r() * 40},${95 + r() * 20},80,.35)`; x.lineWidth = 2 + r() * 3; x.beginPath(); const y = r() * h; x.moveTo(0, y); for (let k = 0; k <= 16; k++) x.lineTo(k * w / 16, y + Math.sin(k * 0.9 + i) * 6); x.stroke(); }
      for (let i = 0; i < 120; i++) { x.fillStyle = 'rgba(30,20,18,.5)'; x.beginPath(); x.ellipse(r() * w, h * (.5 + r() * .5), 6, 3, 0, 0, 7); x.fill(); } }
    if (kind === 'der') { x.fillStyle = '#3e2626'; x.fillRect(0, 0, w, h); for (let i = 0; i < 300; i++) { x.strokeStyle = `rgba(170,120,115,${(.06 + r() * .1).toFixed(2)})`; x.lineWidth = 1.5 + r() * 2.5; x.beginPath(); let px = r() * w, py = r() * h; x.moveTo(px, py); for (let k = 0; k < 6; k++) { px += 20 + r() * 40; py += (r() - .5) * 26; x.lineTo(px, py); } x.stroke(); } }
    if (kind === 'fat') { x.fillStyle = '#3b3122'; x.fillRect(0, 0, w, h); for (let i = 0; i < 160; i++) { const cx = r() * w, cy = r() * h, rr = 18 + r() * 26; const g = x.createRadialGradient(cx, cy - rr * .3, 2, cx, cy, rr); g.addColorStop(0, '#7a6440'); g.addColorStop(1, '#4a3a22'); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, rr, 0, 7); x.fill(); x.strokeStyle = 'rgba(20,14,8,.6)'; x.lineWidth = 2; x.stroke(); } }
  });
}
const skinTop = canvasTex(512, 512, (x, w, h) => { const r = rng(4); x.fillStyle = '#7a5442'; x.fillRect(0, 0, w, h); for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(50,30,20,${(r() * .2).toFixed(3)})`; x.beginPath(); x.arc(r() * w, r() * h, .6 + r(), 0, 7); x.fill(); } });
skinTop.wrapS = skinTop.wrapT = THREE.RepeatWrapping; skinTop.repeat.set(4, 2);
function layer(y0, y1, tex, color, top) {
  const face = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75 });
  const side = new THREE.MeshStandardMaterial({ color, roughness: 0.8 });
  const topM = top ? new THREE.MeshPhysicalMaterial({ map: skinTop, roughness: 0.5, clearcoat: 0.15 }) : side;
  const m = new THREE.Mesh(new THREE.BoxGeometry(BX, y0 - y1, BZ), [side, side, topM, side, face, side]);
  m.position.set(0, (y0 + y1) / 2, -BZ / 2); scene.add(m); return m;
}
layer(0, -EPI, layerTex('epi'), 0x3a281f, true);
layer(-EPI, -DER, layerTex('der'), 0x2a1818, false);
layer(-DER, -FAT, layerTex('fat'), 0x2a2216, false);

/* ---------------- blood vessel: bright red band across the slice, packed with cells ---------------- */
const ART = { y: -17, r: 4.4 };
const chanTex = canvasTex(16, 256, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(120,10,20,0)'); g.addColorStop(0.08, 'rgba(200,30,40,1)'); g.addColorStop(0.18, 'rgba(150,14,26,1)'); g.addColorStop(0.5, 'rgba(110,8,18,1)'); g.addColorStop(0.82, 'rgba(150,14,26,1)'); g.addColorStop(0.92, 'rgba(200,30,40,1)'); g.addColorStop(1, 'rgba(120,10,20,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); });
const chan = new THREE.Mesh(new THREE.PlaneGeometry(BX - 0.4, 2), new THREE.MeshBasicMaterial({ map: chanTex, transparent: true, depthWrite: false })); chan.position.set(0, ART.y, 0.03); scene.add(chan);
const prof = []; for (let i = 0; i <= 14; i++) { const r = i / 14; prof.push(new THREE.Vector2(r, Math.sqrt(Math.max(0, 1 - r * r)) * (0.18 + 0.85 * r * r - 0.55 * r ** 4) * 0.55)); }
for (let i = 14; i >= 0; i--) { const r = i / 14; prof.push(new THREE.Vector2(r, -Math.sqrt(Math.max(0, 1 - r * r)) * (0.18 + 0.85 * r * r - 0.55 * r ** 4) * 0.55)); }
const cellGeo = new THREE.LatheGeometry(prof, 24); cellGeo.computeVertexNormals();
const NCELL = 260;
const cells = new THREE.InstancedMesh(cellGeo, new THREE.MeshPhysicalMaterial({ color: 0x9a0c18, roughness: 0.45, clearcoat: 0.3, clearcoatRoughness: 0.4, emissive: 0x2a0206, envMapIntensity: 0.35 }), NCELL);
scene.add(cells);
const rCell = rng(55), CELL = [...Array(NCELL)].map(() => ({ x: rCell() * BX - BX / 2, v: rCell() * 2 - 1, z: rCell(), ax: rCell() * 6.28, ay: rCell() * 6.28, sp: 0.8 + rCell() * 0.5, s: 0.9 + rCell() * 0.3 }));
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();

/* ---------------- the pod, in glass, showing its navy sensor board (layout illustrative) ---------------- */
const pod = new THREE.Group(); pod.position.set(0, 0, -11); scene.add(pod);
const chrome = new THREE.MeshStandardMaterial({ color: 0xeef0f2, metalness: 1, roughness: 0.1 });
const glassM = new THREE.MeshPhysicalMaterial({ color: 0x9fb8c8, roughness: 0.1, metalness: 0, transparent: true, opacity: 0.16, depthWrite: false, clearcoat: 1 });
const body = new THREE.Mesh(pillow(34.7, 22, 6, 5.4, 1.2), glassM); body.position.y = 2.7; pod.add(body);
const rimm = new THREE.Mesh(pillow(36.4, 23.6, 6.8, 1.4, 0.55), chrome); rimm.position.y = 5.5; pod.add(rimm);
const knitT = canvasTex(256, 256, (x, w, h) => { x.fillStyle = '#060607'; x.fillRect(0, 0, w, h); const r = rng(13), n = 8, c = w / n; for (let j = 0; j < n * 2; j++) for (let i = -1; i <= n; i++) { const l = 44 + r() * 14; x.fillStyle = `rgb(${l},${l},${l + 2})`; x.beginPath(); x.ellipse((i + (j % 2) * .5 + .5) * c, (j + .5) * c / 2, c * .36, c * .3, 0, 0, 7); x.fill(); } });
knitT.wrapS = knitT.wrapT = THREE.RepeatWrapping; knitT.repeat.set(1 / 6, 1 / 6);
const knit = new THREE.Mesh(pillow(33.4, 21, 5.6, 1.0, 0.35), new THREE.MeshPhysicalMaterial({ map: knitT, roughness: 0.9 })); knit.position.y = 6.2; pod.add(knit);
const navyT = canvasTex(512, 64, (x, w, h) => { x.fillStyle = '#0a1638'; x.fillRect(0, 0, w, h); x.fillStyle = '#d9ae55'; for (let i = 0; i < 40; i++) x.fillRect(i * 13 + 3, h - 6, 7, 4); });
const board = new THREE.Mesh(new THREE.BoxGeometry(30, 0.7, 18), new THREE.MeshPhysicalMaterial({ map: navyT, roughness: 0.4, clearcoat: 0.6 })); board.position.y = 1.55; pod.add(board);
const chip = (x, w, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.7, 3), mat); m.position.set(x, 0.85, 9); pod.add(m); return m; };
const LEDX = 0, PDX = [-11, 11];
const ledMat = new THREE.MeshStandardMaterial({ color: 0x0a1a0e, emissive: 0x2cff74, emissiveIntensity: 0 });
const pdMat = new THREE.MeshStandardMaterial({ color: 0x1d1f3c, metalness: 0.5, roughness: 0.2, emissive: 0x2cff74, emissiveIntensity: 0 });
chip(LEDX, 3, ledMat); PDX.forEach(x => chip(x, 3.4, pdMat));
[-20, -5.5, 5.5, 20].forEach(x => chip(x, 2, new THREE.MeshStandardMaterial({ color: 0x0c0d10, roughness: 0.4 })));
for (let i = 0; i < 18; i++) { const g = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.6), new THREE.MeshStandardMaterial({ color: 0xd9ae55, metalness: 1, roughness: 0.25 })); g.position.set(-14 + i * 1.65, 1.15, 9.5); pod.add(g); }
const glow = (color, size) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false })); s.scale.set(size, size, 1); scene.add(s); return s; };
const ledGlow = glow(0x1cff5e, 9); ledGlow.position.set(LEDX, 0.4, 0.5);
const pdGlows = PDX.map(x => { const g = glow(0x1cff5e, 6); g.position.set(x, 0.4, 0.5); return g; });

/* ---------------- light paths: dense scattering walks from the LED to the sensors ---------------- */
const rP = rng(7), PATHS = [];
for (let i = 0; i < 150; i++) {
  const side = rP() < 0.5 ? 0 : 1, tx = PDX[side] + (rP() - .5) * 3, deep = rP(), D = 2.5 + Math.pow(deep, 1.4) * 19;
  const absorbed = D > ART.y * -1 - ART.r - 1 && rP() < 0.8;
  const pts = [new THREE.Vector3(LEDX + (rP() - .5) * 1.5, -0.1, 0.3)], n = 11;
  for (let k = 1; k < n; k++) { const a = k / n, jit = 0.6 + 1.6 * Math.sin(a * Math.PI);
    pts.push(new THREE.Vector3(LEDX + (tx - LEDX) * a + (rP() - .5) * 3 * jit, -D * Math.pow(Math.sin(a * Math.PI), 0.8) * (0.85 + rP() * .3) - 0.2 + (rP() - .5) * jit, 0.3)); }
  if (absorbed) { const k = 5 + Math.floor(rP() * 2); pts.length = k; pts.push(new THREE.Vector3(pts[k - 1].x + (rP() - .5) * 2, ART.y + ART.r * (rP() * .8), 0.35)); }
  else pts.push(new THREE.Vector3(tx, -0.1, 0.3));
  const curve = new THREE.CatmullRomCurve3(pts), len = curve.getLength();
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.07, 4), new THREE.MeshBasicMaterial({ color: 0x35ff7a, transparent: true, opacity: 0, depthWrite: false }));
  scene.add(tube);
  PATHS.push({ curve, len, absorbed, tube, ph: rP(), sp: 14 + rP() * 10 });
}
const NPH = PATHS.length;
const phGeo = new THREE.BufferGeometry(); phGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(NPH * 3), 3)); phGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(NPH * 3), 3));
scene.add(new THREE.Points(phGeo, new THREE.PointsMaterial({ size: 1.6, map: glowTex, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));

/* ---------------- heartbeat with natural beat-to-beat variation ---------------- */
const IBI = [0.83, 0.80, 0.86, 0.82, 0.79, 0.85, 0.81, 0.84];   // seconds between beats (example values)
const BEATS = []; { let tb = -4; for (let i = 0; tb < 60; i++) { BEATS.push(tb); tb += IBI[i % IBI.length]; } }
function beatIdx(t) { let i = 0; while (i < BEATS.length - 2 && BEATS[i + 1] <= t) i++; return i; }
function beat(t) { const i = beatIdx(t), ph = (t - BEATS[i]) / (BEATS[i + 1] - BEATS[i]); return Math.exp(-Math.pow((ph - 0.14) / 0.075, 2)) + 0.35 * Math.exp(-Math.pow((ph - 0.42) / 0.09, 2)); }
const blood = t => 0.5 * beat(t) + 0.5 * beat(t - 0.05);
const lightBack = t => 1 - 0.55 * blood(t);
const troughAt = i => BEATS[i] + 0.14 * (BEATS[i + 1] - BEATS[i]) + 0.025;   // where the reflected light is lowest
const SPS = 26;   // readings per second (WHOOP, official)

/* ---------------- overlay ---------------- */
const $ = id => document.getElementById(id);
const PILLS = { pLed: [-19, 3, 0.4], pPd: [19, 3, 0.4], pArt: [-19, ART.y, 1] };
const PILL_OFF = { pLed: [-120, 10], pPd: [130, 10], pArt: [0, 0] };
