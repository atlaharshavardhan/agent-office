[project]
name = "invisitech-pipeline"
version = "0.1.0"
description = "InvisiTech YouTube agent pipeline: pre-production (trailer) phase. Director 'Harsha' orchestrates agents with LangGraph."
requires-python = ">=3.10"
# Everything here is free and open source. Nothing paid is installed.
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional: renders storyboard HTML frames to PNG. Free. Run `playwright install chromium` after.
frames = ["playwright>=1.40"]

[project.scripts]
invisitech = "invisitech.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["invisitech*"]

[tool.setuptools.package-data]
invisitech = ["schema.sql", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude CLI (skipped unless INVISITECH_LIVE=1)"]
