<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirPods ear detection storyboard</title>
<style>
  :root { --red: #ff3b55; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(90% 60% at 50% 45%, #22202a 0%, #111015 55%, #050507 100%); font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
  canvas { display: block; }
  body::before, body::after { content: ''; position: fixed; left: 0; right: 0; pointer-events: none; z-index: 1; }
  body::before { top: 0; height: 34%; background: linear-gradient(rgba(5,5,8,.82), rgba(5,5,8,.45) 60%, transparent); }
  body::after { bottom: 0; height: 12%; background: linear-gradient(transparent, rgba(5,5,8,.7)); }
  .ov, #player, .tag, .big, #lines { z-index: 2; }
  .ov { position: fixed; left: 0; right: 0; pointer-events: none; text-align: center; color: #fff; }
  #top { top: 9%; padding: 0 7%; font-weight: 800; font-size: 7.4vw; line-height: 1.12; letter-spacing: -0.01em; text-shadow: 0 4px 24px rgba(0,0,0,.8); }
  #top em { font-style: normal; color: var(--red); }
  #sub { top: calc(9% + 1px); margin-top: 0; font-weight: 600; font-size: 4.2vw; color: rgba(255,255,255,.82); padding: 0 9%; }
  #note { bottom: 4.5%; font-size: 3vw; color: rgba(255,255,255,.62); }
  #shotTag { top: 2.4%; left: 4%; right: auto; text-align: left; font: 600 2.6vw ui-monospace, Menlo, monospace; letter-spacing: .12em; color: rgba(255,255,255,.5); }
  /* music widget */
  #player { position: fixed; left: 8%; right: 8%; bottom: 11%; display: none; align-items: center; gap: 3.6vw; padding: 3.4vw 4vw; border-radius: 6vw;
    background: rgba(30,30,36,.78); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,.6); color: #fff; }
  #art { width: 14vw; height: 14vw; border-radius: 3vw; background: linear-gradient(135deg, #ff8a3c, #c2185b 60%, #4a148c); flex: none; }
  #meta { flex: 1; min-width: 0; }
  #meta b { display: block; font-size: 4.2vw; } #meta span { font-size: 3.4vw; color: rgba(255,255,255,.6); }
  #bar { margin-top: 2vw; height: 1vw; border-radius: 1vw; background: rgba(255,255,255,.18); overflow: hidden; } #bar i { display: block; height: 100%; width: 38%; background: #fff; }
  #btn { width: 13vw; height: 13vw; border-radius: 50%; background: #fff; flex: none; display: grid; place-items: center; }
  #btn svg { width: 6vw; height: 6vw; }
  #state { position: absolute; right: 5vw; top: -6.2vw; font: 700 3.2vw Inter, Arial, sans-serif; letter-spacing: .08em; padding: 1vw 2.6vw; border-radius: 3vw; }
  .tag { position: fixed; transform: translate(-50%, -50%); pointer-events: none; color: #fff; font: 700 3.4vw Inter, Arial, sans-serif; white-space: nowrap;
    padding: 1.3vw 2.8vw; border-radius: 3vw; background: rgba(18,18,24,.82); border: 1px solid rgba(255,255,255,.18); }
  .tag.red { border-color: var(--red); color: #ffd9de; }
  .big { position: fixed; transform: translate(-50%, -50%); font: 900 22vw Inter, Arial, sans-serif; pointer-events: none; text-shadow: 0 0 40px rgba(0,0,0,.6); }
  #lines { position: fixed; inset: 0; pointer-events: none; }
</style></head>
<body>
<div class="ov" id="shotTag"></div>
<div class="ov" id="top"></div>
<div class="ov" id="note"></div>
<div id="player"><div id="state"></div><div id="art"></div><div id="meta"><b>Midnight Drive</b><span>Now playing</span><div id="bar"><i></i></div></div><div id="btn"></div></div>
<svg id="lines"></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../face-id/assets/GLTFLoader.js"></script>
<script src="../face-id/assets/head-data.js"></script>
<script src="../phone-teardown/assets/airpods-pro-model.compact.js"></script>
<script>
(() => {
const Q = new URLSearchParams(location.search), SHOT = Q.get('shot') || '1';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 1, 5000);
let ready = false; window.__tourReady = () => ready;
const RED = 0xff3b55;

/* studio environment for glossy plastic */
{
  const pm = new THREE.PMREMGenerator(renderer), env = new THREE.Scene();
  const c = document.createElement('canvas'); c.width = 16; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#9aa3b8'); g.addColorStop(0.5, '#2a2c34'); g.addColorStop(1, '#0b0b0e'); x.fillStyle = g; x.fillRect(0, 0, 16, 256);
  env.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.BackSide })));
  for (const [px, py, pz, s] of [[60, 50, 40, 40], [-70, 30, -30, 30], [0, 80, -60, 50]]) { const q = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })); q.position.set(px, py, pz); q.lookAt(0, 0, 0); env.add(q); }
  scene.environment = pm.fromScene(env, 0.04).texture;
}
scene.add(new THREE.HemisphereLight(0x9aa4c0, 0x120e12, 0.45));
const key = new THREE.DirectionalLight(0xfff1e6, 1.35); key.position.set(300, 260, 380); scene.add(key);
const rim = new THREE.DirectionalLight(0x8fa8ff, 1.0); rim.position.set(-200, 160, -400); scene.add(rim);
const redLight = new THREE.PointLight(RED, 0, 90, 2); scene.add(redLight);

/* ---------- earbud (right bud of "AirPods Pro" by Jed Falcone, CC BY 4.0) ---------- */
const BUD = new THREE.Group(); scene.add(BUD);
const INNER = new THREE.Group(); BUD.add(INNER); INNER.visible = false;
let SHELL = [], SENSOR = new THREE.Group(), SENSOR_N = new THREE.Vector3(), H2P = new THREE.Vector3(), MOUTH = new THREE.Vector3();
function loadBud() {
  const C = window.AIRPODS_COMPACT, bytes = Uint8Array.from(atob(C.bin), c => c.charCodeAt(0));
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(ab => {
    const raw = new THREE.Group(), tex = new THREE.TextureLoader().load(C.tex); tex.encoding = THREE.sRGBEncoding; tex.flipY = false;
    C.meshes.forEach(m => {
      if (m.grp !== 'buds' || m.side !== 'R') return;
      const q = new Uint16Array(ab, m.po, m.n * 3), pos = new Float32Array(m.n * 3);
      for (let i = 0; i < m.n; i++) for (let j = 0; j < 3; j++) pos[i * 3 + j] = m.min[j] + q[i * 3 + j] / 65535 * m.sc[j];
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setIndex(new THREE.BufferAttribute(m.i32 ? new Uint32Array(ab, m.io, m.ni) : new Uint16Array(ab, m.io, m.ni), 1));
      if (m.tex) { const uq = new Uint16Array(ab, m.uo, m.n * 2), uv = new Float32Array(m.n * 2); for (let i = 0; i < m.n * 2; i++) uv[i] = uq[i] / 65535; g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); }
      g.computeVertexNormals();
      const white = m.col[0] > 0.9;
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(m.col[0], m.col[1], m.col[2]), metalness: white ? 0 : 0.2, roughness: white ? 0.3 : 0.55, map: m.tex ? tex : null, envMapIntensity: white ? 0.9 : 0.4 });
      if (white) mat.color.setRGB(0.93, 0.93, 0.94);
      const mesh = new THREE.Mesh(g, mat); mesh.name = m.name; raw.add(mesh); if (white) SHELL.push(mesh);
    });
    const bb = new THREE.Box3().setFromObject(raw), c = bb.getCenter(new THREE.Vector3()), k = 30.9 / (bb.max.y - bb.min.y);
    raw.children.forEach(o => { o.geometry.translate(-c.x, -c.y, -c.z); o.geometry.scale(k, k, k); o.geometry.computeBoundingSphere(); });
    raw.children.slice().forEach(o => BUD.add(o));
  });
}
function buildInternals() {
  // the skin-detect sensor sits on the inner face of the bud, the side that rests against your ear
  BUD.updateMatrixWorld(true);
  const shell = BUD.getObjectByName('Cube_2_Mat.1_0'), rc = new THREE.Raycaster();
  const from = new THREE.Vector3(1.5, 6.5, 0.5), dir = new THREE.Vector3(-0.55, 0.45, -0.7).normalize();
  rc.set(from, dir); const hit = rc.intersectObject(shell, false)[0];
  const p = hit ? hit.point : from.clone().addScaledVector(dir, 8), n = hit ? hit.face.normal.clone() : dir.clone();
  if (n.dot(dir) < 0) n.negate(); SENSOR_N.copy(n);
  SENSOR.position.copy(p).addScaledVector(n, 0.12); SENSOR.lookAt(p.clone().add(n)); BUD.add(SENSOR);
  const win = new THREE.Mesh(new THREE.CircleGeometry(2.1, 40), new THREE.MeshStandardMaterial({ color: 0x0b0b0e, roughness: 0.15, metalness: 0.3, envMapIntensity: 1.2 })); win.scale.set(1.5, 1, 1); SENSOR.add(win);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(2.1, 40), new THREE.MeshBasicMaterial({ color: RED, transparent: true, opacity: 0 })); glow.scale.set(1.5, 1, 1); glow.position.z = 0.05; glow.name = 'glow'; SENSOR.add(glow);
  // LED + photodiode pads behind the window
  const mod = new THREE.Group(); mod.position.z = -1.0; SENSOR.add(mod);
  mod.add(new THREE.Mesh(new THREE.BoxGeometry(5.6, 3.8, 0.5), new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.5 })));
  for (const [x, c] of [[-1.4, RED], [1.4, 0x3a4150]]) { const d = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 0.5), new THREE.MeshStandardMaterial({ color: c, emissive: x < 0 ? RED : 0, emissiveIntensity: x < 0 ? 0.8 : 0, roughness: 0.3 })); d.position.set(x, 0, 0.4); mod.add(d); }
  INNER.add(mod.clone()); // ghost copy not needed visually but keeps INNER non-empty
  // simplified internals for the x-ray shots (battery, driver, H2 in the stem)
  const dark = new THREE.MeshStandardMaterial({ color: 0x2a2d34, roughness: 0.45, metalness: 0.5 });
  const batt = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.3, 4.2, 40), new THREE.MeshStandardMaterial({ color: 0x8a9099, roughness: 0.3, metalness: 0.9 })); batt.position.set(3.0, 7.0, -0.3); batt.rotation.z = Math.PI / 2; INNER.add(batt);
  const drv = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 1.0, 40), dark); drv.position.set(-2.6, 4.2, 0); drv.rotation.z = Math.PI / 2; INNER.add(drv);
  const h2 = new THREE.Mesh(new THREE.BoxGeometry(2.6, 6.5, 1.4), new THREE.MeshStandardMaterial({ color: 0x1b1d22, roughness: 0.35, metalness: 0.4 })); h2.position.set(6.4, -6.5, 1.0); INNER.add(h2);
  const lab = document.createElement('canvas'); lab.width = 64; lab.height = 128; const lx = lab.getContext('2d'); lx.fillStyle = '#1b1d22'; lx.fillRect(0, 0, 64, 128); lx.fillStyle = '#d8dce4'; lx.font = 'bold 40px Arial'; lx.textAlign = 'center'; lx.fillText('H2', 32, 78);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 6.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(lab) })); face.position.set(6.4, -6.5, 1.75); INNER.add(face);
  H2P.set(6.4, -6.5, 1.0);
  const flex = new THREE.Mesh(new THREE.BoxGeometry(1.6, 13, 0.25), new THREE.MeshStandardMaterial({ color: 0xc8892f, roughness: 0.4, metalness: 0.6 })); flex.position.set(6.4, 0.5, 0.2); INNER.add(flex);
}
function xray(on, a = 0.16) {
  SHELL.concat(BUD.children.filter(o => o.isMesh)).forEach(o => { const m = o.material; m.transparent = on; m.opacity = on ? a : 1; m.depthWrite = !on; });
  INNER.visible = on;
}
function sensorGlow(v) { const g = SENSOR.getObjectByName('glow'); g.material.opacity = v; SENSOR.getWorldPosition(redLight.position); redLight.position.addScaledVector(SENSOR_N.clone().transformDirection(BUD.matrixWorld), 4); redLight.intensity = v * 2.2; }

/* ---------- head (Lee Perry-Smith scan, CC BY 3.0) ---------- */
let HEAD = null; const EAR = new THREE.Vector3();
function loadHead() {
  return new Promise(res => {
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer, tl = new THREE.TextureLoader();
    new THREE.GLTFLoader().parse(b64(window.HEAD_GLB), '', gltf => {
      const head = gltf.scene.getObjectByProperty('type', 'Mesh') || gltf.scene.children.find(o => o.isMesh);
      const col = tl.load(window.HEAD_COL); col.encoding = THREE.sRGBEncoding; const nrm = tl.load(window.HEAD_NRM);
      head.material = new THREE.MeshStandardMaterial({ map: col, normalMap: nrm, normalScale: new THREE.Vector2(0.8, 0.8), color: 0xb07a5c, roughness: 0.6, envMapIntensity: 0.35 });
      const g = head.geometry; g.computeBoundingBox(); const bb = g.boundingBox, ctr = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
      // scale by the head itself (the scan is a bust): ear-to-ear about 160 mm
      g.translate(-ctr.x, -ctr.y, -ctr.z); const pa = g.attributes.position, yTop = bb.max.y - ctr.y, hReg = y => y > yTop - 0.42 * sz.y;
      let mx = 0; for (let i = 0; i < pa.count; i++) if (hReg(pa.getY(i))) mx = Math.max(mx, pa.getX(i));
      const acc = new THREE.Vector3(); let n = 0;
      for (let i = 0; i < pa.count; i++) if (hReg(pa.getY(i)) && pa.getX(i) > mx - 0.05 * mx) { acc.x += pa.getX(i); acc.y += pa.getY(i); acc.z += pa.getZ(i); n++; }
      const k = 80 / mx; g.scale(k, k, k); g.computeBoundingBox(); g.computeBoundingSphere();
      EAR.copy(acc.multiplyScalar(k / n)); window.__ear = EAR.toArray();
      head.position.set(0, 0, 0); head.rotation.set(0, 0, 0); head.scale.set(1, 1, 1);
      HEAD = head; scene.add(head);
      const wait = () => (col.image && nrm.image) ? res() : setTimeout(wait, 30); wait();
    });
  });
}

/* ---------- overlay helpers ---------- */
const $ = id => document.getElementById(id);
const ICON = { pause: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#111"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#111"/></svg>',
               play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" fill="#111"/></svg>' };
function player(state) { // state: 'playing' | 'paused'
  $('player').style.display = 'flex';
  $('btn').innerHTML = state === 'paused' ? ICON.play : ICON.pause;
  $('meta').querySelector('span').textContent = state === 'paused' ? 'Paused' : 'Now playing';
  const s = $('state'); s.textContent = state === 'paused' ? '❚❚  PAUSED' : '▶  PLAYING';
  s.style.background = state === 'paused' ? '#ff3b55' : '#2fd36b'; s.style.color = state === 'paused' ? '#fff' : '#05210f';
}
function proj(v) { const p = v.clone().project(camera); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; }
function tag(text, world, dx, dy, cls = '') {
  const [x, y] = proj(world), el = document.createElement('div'); el.className = 'tag ' + cls; el.textContent = text; el.style.left = (x + dx) + 'px'; el.style.top = (y + dy) + 'px'; document.body.appendChild(el);
  const svg = $('lines'), l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', x); l.setAttribute('y1', y); l.setAttribute('x2', x + dx * 0.78); l.setAttribute('y2', y + dy * 0.78);
  l.setAttribute('stroke', cls === 'red' ? '#ff3b55' : 'rgba(255,255,255,.7)'); l.setAttribute('stroke-width', 2.5); svg.appendChild(l);
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 6); c.setAttribute('fill', cls === 'red' ? '#ff3b55' : '#fff'); svg.appendChild(c);
}
function big(text, x, y, color) { const el = document.createElement('div'); el.className = 'big'; el.textContent = text; el.style.left = x * W + 'px'; el.style.top = y * H + 'px'; el.style.color = color; document.body.appendChild(el); }

/* infrared rays: glowing tubes from a to b */
function ray(a, b, w = 0.35, op = 0.9, dashed = false) {
  const d = b.clone().sub(a), len = d.length(), grp = new THREE.Group();
  const segs = dashed ? Math.max(2, Math.round(len / 3.2)) : 1;
  for (let i = 0; i < segs; i++) {
    if (dashed && i % 2) continue;
    const l0 = len * i / segs, l1 = len * (i + 1) / segs;
    for (const [r, o] of [[w, op], [w * 3.2, op * 0.18]]) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, l1 - l0, 12), new THREE.MeshBasicMaterial({ color: RED, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false }));
      m.position.copy(a).addScaledVector(d, (l0 + l1) / 2 / len); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()); grp.add(m);
    }
  }
  scene.add(grp); return grp;
}
function arrowHead(at, dirV, s = 1.6) { const m = new THREE.Mesh(new THREE.ConeGeometry(s, s * 2.4, 16), new THREE.MeshBasicMaterial({ color: RED })); m.position.copy(at); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirV.clone().normalize()); scene.add(m); }
function wood() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#2e1d12'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 140; i++) { x.strokeStyle = `rgba(${20 + Math.random() * 40},${12 + Math.random() * 20},6,${0.15 + Math.random() * 0.25})`; x.lineWidth = 1 + Math.random() * 3; x.beginPath(); const y = Math.random() * 512; x.moveTo(0, y); for (let k = 0; k <= 8; k++) x.lineTo(k * 64, y + Math.sin(k * 0.9 + i) * 6); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 14); return t;
}
function look(pos, target) { camera.position.copy(pos); camera.lookAt(target); camera.updateMatrixWorld(); camera.updateProjectionMatrix(); }

/* the bud seated in the right ear: tip into the canal, stem pointing down and slightly forward */
const CANAL = new THREE.Vector3(), SEAT = new THREE.Vector3(Number(Q.get('sx') || 3), Number(Q.get('sy') || 0), Number(Q.get('sz') || 3));
function seatInEar(out = 0) {
  CANAL.copy(EAR).add(new THREE.Vector3(-12, -13, 22));
  BUD.position.copy(CANAL).add(SEAT).add(new THREE.Vector3(out, -out * 0.25, out * 0.45));
  BUD.rotation.set(0, 0, 0); BUD.rotateX(+(Q.get('rx') || -0.3)); BUD.rotateZ(-0.12 - out * 0.004); BUD.rotateY(-0.15 + out * 0.01);
  BUD.updateMatrixWorld(true);
}

/* ---------- shots ---------- */
const SHOTS = {
  'e': () => { seatInEar(0); const v = Q.get('v') || '1,0,0.3'; const d = new THREE.Vector3(...v.split(',').map(Number)).normalize(); look(CANAL.clone().addScaledVector(d, 170), CANAL); return () => {}; },
  'h': () => { const v = Q.get('v') || '1,0,0'; const d = new THREE.Vector3(...v.split(',').map(Number)).normalize(); BUD.visible = false; look(d.multiplyScalar(420), new THREE.Vector3()); const m = new THREE.Mesh(new THREE.SphereGeometry(4), new THREE.MeshBasicMaterial({ color: 0x00ff00 })); m.position.copy(EAR); scene.add(m); return () => {}; },
  '1': () => { // hook
    seatInEar(52); BUD.rotateX(0.25); BUD.rotateZ(0.45); BUD.updateMatrixWorld(true);
    look(CANAL.clone().add(new THREE.Vector3(1, 0.08, 0.5).normalize().multiplyScalar(230)), CANAL.clone().add(new THREE.Vector3(14, -14, 14)));
    // motion streaks behind the bud
    for (let i = 0; i < 4; i++) { const a = BUD.position.clone().add(new THREE.Vector3(-24, 14 - i * 4.5, -11)), b = BUD.position.clone().add(new THREE.Vector3(-8, 10 - i * 4.5, -4));
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, a.distanceTo(b), 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 - i * 0.05 })); m.position.copy(a).lerp(b, 0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); scene.add(m); }
    $('top').innerHTML = 'Pull one out…<br><em>music stops.</em>';
    player('paused');
    $('note').textContent = '';
    return () => tag('How did it know?', BUD.position.clone().add(new THREE.Vector3(0, 12, 0)), W * 0.02, -H * 0.13, 'red');
  },
  '2': () => { // x-ray to the sensor
    BUD.position.set(0, 0, 0); BUD.rotation.set(0, Math.atan2(-SENSOR_N.x, SENSOR_N.z) * -1, 0); BUD.updateMatrixWorld(true);
    { const n = SENSOR_N.clone().transformDirection(BUD.matrixWorld); BUD.rotateY(Math.atan2(n.x, n.z) * -1 + 0.35); BUD.updateMatrixWorld(true); }
    xray(true, 0.3); sensorGlow(1);
    const s = new THREE.Vector3(); SENSOR.getWorldPosition(s);
    look(new THREE.Vector3(10, 14, 120), new THREE.Vector3(0, -1, 0));
    $('top').innerHTML = 'Inside: a <em>skin-detect</em> sensor';
    $('note').textContent = 'Illustrative · not to scale';
    return () => { tag('Skin-detect sensor', s, W * 0.12, -H * 0.1, 'red'); };
  },
  '3': () => { // light on skin
    seatInEar(0); xray(true, 0.22); sensorGlow(1);
    HEAD.material.transparent = false;
    const s = new THREE.Vector3(); SENSOR.getWorldPosition(s);
    const n = SENSOR_N.clone().transformDirection(BUD.matrixWorld);
    const tgt = s.clone().addScaledVector(n, 7);
    look(s.clone().add(new THREE.Vector3(70, 40, 95)), s.clone().add(new THREE.Vector3(-2, -2, 0)));
    // out to the skin and back
    const side = new THREE.Vector3().crossVectors(n, new THREE.Vector3(0, 1, 0)).normalize();
    for (let i = -1; i <= 1; i++) { const a = s.clone().addScaledVector(side, i * 1.2 - 0.8), b = tgt.clone().addScaledVector(side, i * 2.8); ray(a, b, 0.32, 0.95); }
    for (let i = -1; i <= 1; i += 2) { const b = tgt.clone().addScaledVector(side, i * 2.2 + 1.5), a = s.clone().addScaledVector(side, 1.5 + i * 0.4); ray(b, a, 0.26, 0.75, true); }
    $('top').innerHTML = 'It shines <em>invisible light</em><br>and reads what bounces back';
    $('note').textContent = 'Short-wave infrared shown in red · invisible to the eye';
    return () => { tag('Skin', tgt.clone().addScaledVector(n, 2), W * 0.2, H * 0.1, ''); };
  },
  '4': () => { // table: not skin
    const table = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ map: wood(), roughness: 0.9, envMapIntensity: 0 })); table.rotation.x = -Math.PI / 2; scene.add(table);
    BUD.rotation.set(0, 0, 0); BUD.position.set(0, 0, 0); BUD.updateMatrixWorld(true);
    // lie the bud on its side with the sensor facing the table
    const n0 = SENSOR_N.clone().transformDirection(BUD.matrixWorld);
    BUD.quaternion.premultiply(new THREE.Quaternion().setFromUnitVectors(n0, new THREE.Vector3(0, -1, 0)));
    BUD.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(BUD); BUD.position.y = -bb.min.y + 0.2; BUD.updateMatrixWorld(true);
    sensorGlow(1);
    const s = new THREE.Vector3(); SENSOR.getWorldPosition(s); const fl = new THREE.Vector3(s.x, 0.1, s.z);
    for (let i = -1; i <= 1; i++) ray(s.clone().add(new THREE.Vector3(i * 1.2, 0, 0)), fl.clone().add(new THREE.Vector3(i * 4, 0, 2)), 0.3, 0.95);
    for (let i = -1; i <= 1; i += 2) ray(fl.clone().add(new THREE.Vector3(i * 9, 0, -2)), s.clone().add(new THREE.Vector3(i * 1.5, 0, 0)), 0.22, 0.5, true);
    const glowFloor = new THREE.Mesh(new THREE.CircleGeometry(9, 40), new THREE.MeshBasicMaterial({ color: RED, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false })); glowFloor.rotation.x = -Math.PI / 2; glowFloor.position.copy(fl); scene.add(glowFloor);
    key.intensity = 0.8;
    look(new THREE.Vector3(70, 60, 125), new THREE.Vector3(0, 4, 0));
    $('top').innerHTML = 'Table or pocket?<br>The light <em>doesn’t match skin</em>';
    $('note').textContent = 'Older AirPods used simpler optical sensors that a pocket could fool';
    return () => big('✕', 0.74, 0.43, '#ff3b55');
  },
  '5': () => { // signal to the chip and the phone
    BUD.position.set(-4, 14, 0); BUD.rotation.set(0.05, 0.35, 0.1); BUD.updateMatrixWorld(true);
    xray(true, 0.14); sensorGlow(0.9);
    const s = new THREE.Vector3(); SENSOR.getWorldPosition(s); const h = BUD.localToWorld(H2P.clone());
    const mid = BUD.localToWorld(new THREE.Vector3(6.4, 6, 1.2));
    ray(s, mid, 0.3, 1); ray(mid, h, 0.3, 1); arrowHead(h.clone().add(new THREE.Vector3(0, 4.5, 0)), h.clone().sub(mid), 1.3);
    // bluetooth waves from the stem toward the phone
    for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(6 + i * 5, 0.35, 8, 48, Math.PI * 0.6), new THREE.MeshBasicMaterial({ color: 0x6fc3ff, transparent: true, opacity: 0.85 - i * 0.22 }));
      r.position.copy(h).add(new THREE.Vector3(2, -6, 0)); r.rotation.z = -Math.PI * 0.5 - Math.PI * 0.3; scene.add(r); }
    look(new THREE.Vector3(0, 4, 165), new THREE.Vector3(0, 2, 0));
    $('top').innerHTML = 'Sensor → <em>H2 chip</em> → your phone';
    player('paused');
    $('note').textContent = '';
    return () => { tag('H2 chip', h, W * 0.22, -H * 0.02); tag('Sensor', s, -W * 0.2, -H * 0.06, 'red'); };
  },
  '6': () => { // payoff: back in, music resumes
    seatInEar(0);
    look(CANAL.clone().add(new THREE.Vector3(1, 0.08, 0.5).normalize().multiplyScalar(230)), CANAL.clone().add(new THREE.Vector3(14, -14, 14)));
    sensorGlow(0.0);
    $('top').innerHTML = 'Skin = <em style="color:#2fd36b">play</em>.<br>Anything else = <em>pause</em>.';
    player('playing');
    $('note').textContent = '';
    return () => {};
  },
};

Promise.all([loadBud(), loadHead()]).then(() => {
  buildInternals();
  const shotHasHead = ['1', '3', '6', 'h', 'e'].includes(SHOT); HEAD.visible = shotHasHead;
  $('shotTag').textContent = 'SHOT ' + SHOT;
  const after = SHOTS[SHOT]();
  renderer.render(scene, camera);
  after && after();
  requestAnimationFrame(() => { renderer.render(scene, camera); ready = true; });
});
})();
</script>
