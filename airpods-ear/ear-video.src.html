/* materials: dark navy boards, gold, steel, black glass, amber flex — no green */
const MAT = {
  steel: new THREE.MeshStandardMaterial({ color: 0xd3d8df, metalness: 1, roughness: 0.26 }),

  gold: new THREE.MeshStandardMaterial({ color: 0xe6b85c, metalness: 1, roughness: 0.2 }),

const SOLID = [], GHOST = [];

const H2P = new THREE.Object3D(), BATT_P = new THREE.Object3D(), DRV_P = new THREE.Object3D();
let SENSOR_HALO, H2_HALO, WINDOW_GLASS, RED_DIE;

function buildInternals() {

  const shell = BUD.getObjectByName('Cube_2_Mat.1_0'), rc = new THREE.Raycaster();

  const st = new THREE.Group(); st.position.set(7.1, -8.4, 1.4); INNER.add(st);

  const h2 = box(2.3, 3.2, 0.6, new THREE.MeshStandardMaterial({ map: etched('H2', 2.3, 3.2, 'APL'), roughness: 0.42, metalness: 0.2 }), 0, 3.0, 0.5, st);
  box(2.0, 2.2, 0.55, new THREE.MeshStandardMaterial({ map: etched('', 2, 2.2), roughness: 0.42, metalness: 0.2 }), 0, -0.4, 0.48, st);
