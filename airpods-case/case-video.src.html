<script>
(() => {
const Q = new URLSearchParams(location.search);
if (Q.get('zones')) document.getElementById('zones').style.display = 'block';
const W = innerWidth, H = innerHeight;
/* scene boundaries (seconds); replaced by the voice timeline once the narration is recorded */
const B = window.__B || [0, 2.0, 8.6, 22.0, 29.0, 34.6, 41.8, 46.0, 49.0];
const ORIG = [2.0, 3.5, 10.5, 3.0, 9.0, 9.0, 6.0, 3.0];   // the length each shot was designed at
const TOTAL = B[B.length - 1];
const clamp01 = x => Math.max(0, Math.min(1, x)), ease = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3), lerp = (a, b, k) => a + (b - a) * k, ramp = (u, a, b) => clamp01((u - a) / (b - a));
const bump = (u, a, b) => Math.sin(Math.PI * ramp(u, a, b));
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true }); renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, W / H, 10, 3000);
let ready = false;

/* black studio, like a product launch film: pure black, light from above and from both sides behind,
   so white plastic gets bright edges and soft dark middles. The renderer is transparent so big words can sit behind the product. */
{
  const pm = new THREE.PMREMGenerator(renderer), env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide })));
  const soft = (w, h, x, y, z, v) => { const q = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(v, v, v), side: THREE.DoubleSide })); q.position.set(x, y, z); q.lookAt(0, 0, 0); env.add(q); };
  soft(90, 50, 0, 85, 10, 1.6);          // big softbox overhead
  soft(16, 140, -80, 10, -45, 2.4);      // tall strip, back left (rim)
  soft(16, 140, 80, 10, -45, 2.4);       // tall strip, back right (rim)
  soft(50, 34, 0, 30, 90, 0.42);         // soft front fill
  scene.environment = pm.fromScene(env, 0.03).texture; scene.background = null;
}
scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.32));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(0, 500, 120); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(-420, 120, -320); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xffffff, 1.6); rim2.position.set(420, 120, -320); scene.add(rim2);

function radial(stops, size = 128) { const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2); stops.forEach(([o, col]) => g.addColorStop(o, col)); x.fillStyle = g; x.fillRect(0, 0, size, size); return new THREE.CanvasTexture(c); }
const HALO_B = radial([[0, 'rgba(235,248,255,1)'], [0.2, 'rgba(120,200,255,0.85)'], [0.55, 'rgba(80,170,255,0.2)'], [1, 'rgba(80,170,255,0)']]);
const HALO_G = radial([[0, 'rgba(235,255,240,1)'], [0.2, 'rgba(90,240,140,0.85)'], [0.55, 'rgba(47,211,107,0.22)'], [1, 'rgba(47,211,107,0)']]);
const HALO_A = radial([[0, 'rgba(255,248,230,1)'], [0.2, 'rgba(255,190,90,0.85)'], [0.55, 'rgba(255,170,60,0.22)'], [1, 'rgba(255,170,60,0)']]);
const HALO_Y = radial([[0, 'rgba(255,250,235,1)'], [0.22, 'rgba(255,214,120,0.9)'], [0.55, 'rgba(240,190,90,0.25)'], [1, 'rgba(240,190,90,0)']]);
function sprite(tex, s) { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false })); m.scale.set(s, s, 1); return m; }

/* materials: navy boards, gold, steel, black glass, amber flex; no green boards */
const MAT = {
  white: () => new THREE.MeshPhysicalMaterial({ color: 0xf1f2f4, roughness: 0.32, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.35, envMapIntensity: 0.9 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xd3d8df, metalness: 1, roughness: 0.26 }),
  dsteel: new THREE.MeshStandardMaterial({ color: 0x4a505a, metalness: 1, roughness: 0.32 }),
  black: new THREE.MeshStandardMaterial({ color: 0x0d0e11, metalness: 0.25, roughness: 0.32, envMapIntensity: 0.8 }),
  navy: new THREE.MeshStandardMaterial({ color: 0x12204a, metalness: 0.2, roughness: 0.4 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xe6b85c, metalness: 1, roughness: 0.2 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xd6874a, metalness: 1, roughness: 0.26 }),
  copperDk: new THREE.MeshStandardMaterial({ color: 0xa8612f, metalness: 1, roughness: 0.34 }),
  ceramic: new THREE.MeshStandardMaterial({ color: 0xc9b48f, metalness: 0, roughness: 0.5 }),
  magnet: new THREE.MeshStandardMaterial({ color: 0x8d939c, metalness: 0.95, roughness: 0.3 }),
  ferrite: new THREE.MeshStandardMaterial({ color: 0x15171b, metalness: 0.3, roughness: 0.6 }),
};
const GLOW = { pin: new THREE.MeshStandardMaterial({ color: 0xe6b85c, metalness: 1, roughness: 0.2, emissive: 0xffc860, emissiveIntensity: 0 }) };
function labelTex(lines, bg, fg, w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, w, h);
  x.fillStyle = fg; x.textAlign = 'center'; let y = h * 0.42; lines.forEach(([t, s], i) => { x.font = `600 ${s}px Sora, Arial`; x.fillText(t, w / 2, y); y += s * 1.15; });
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
function etched(text, w, h, sub) {
  const c = document.createElement('canvas'); c.width = w * 40; c.height = h * 40; const x = c.getContext('2d');
  x.fillStyle = '#0e0f12'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#9ea4ae'; x.textAlign = 'center'; x.font = `600 ${c.height * 0.3}px Sora, Arial`; x.fillText(text, c.width / 2, c.height * (sub ? 0.5 : 0.6));
  if (sub) { x.font = `500 ${c.height * 0.13}px 'IBM Plex Mono', monospace`; x.fillStyle = '#6f7580'; x.fillText(sub, c.width / 2, c.height * 0.76); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}
function flexTex() { const c = document.createElement('canvas'); c.width = 64; c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#b8691c'; x.fillRect(0, 0, 64, 512); x.fillStyle = '#f0c46a'; for (let i = 0; i < 5; i++) x.fillRect(8 + i * 11, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 6); return t; }
const FLEX = new THREE.MeshStandardMaterial({ map: flexTex(), roughness: 0.35, metalness: 0.2 });
const ghostMat = (col = 0xe9eef8) => new THREE.ShaderMaterial({
  uniforms: { col: { value: new THREE.Color(col) }, alpha: { value: 0 } }, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'uniform vec3 col; uniform float alpha; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.4); gl_FragColor = vec4(col * (0.55 + 0.7 * f), (0.03 + 0.6 * f) * alpha); }'
});
const box = (w, h, d, mat, x, y, z, p) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); p.add(m); return m; };
const cylY = (r, len, mat, x, y, z, p, seg = 32) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat); m.position.set(x, y, z); p.add(m); return m; };
function rrShape(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
const rrBox = (w, h, d, r, bev, mat) => { const g = new THREE.ExtrudeGeometry(rrShape(w, h, r), { depth: d - 2 * bev, bevelEnabled: bev > 0, bevelThickness: bev, bevelSize: bev, bevelSegments: 3, curveSegments: 12 }); g.translate(0, 0, -(d - 2 * bev) / 2); return new THREE.Mesh(g, mat); };
function caps(parent, pts) { pts.forEach(([x, y, z, rot]) => { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.z = rot || 0; parent.add(g);
  box(0.5, 0.26, 0.26, MAT.ceramic, 0, 0, 0, g); box(0.12, 0.28, 0.28, MAT.steel, -0.3, 0, 0, g); box(0.12, 0.28, 0.28, MAT.steel, 0.3, 0, 0, g); }); }

/* ---------- the real case: "AirPods Pro" by Jed Falcone (CC BY 4.0), modified ----------
   Frame: millimetres, origin at the centre of the lid line, +y up, +z = front (status light), hinge at the back. */
const GEO = {};   // name|side → geometry in case mm
let K = 1;
function loadModel() {
  const C = window.AIRPODS_COMPACT, bytes = Uint8Array.from(atob(C.bin), c => c.charCodeAt(0));
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(ab => {
    const raw = [];
    GEO.tex = new THREE.TextureLoader().load(C.tex); GEO.tex.encoding = THREE.sRGBEncoding; GEO.tex.flipY = false;
