{

function loadMac() {
  return new Promise(res => new THREE.GLTFLoader().parse(window.MBP_GLTF, '', g => {
    const root = g.scene; root.scale.setScalar(1000); MAC.add(root); root.updateMatrixWorld(true);
    const lidNode = root.getObjectByName('Bevels_2'), meshes = []; root.traverse(o => { if (o.isMesh) meshes.push(o); });
    const inLid = o => { for (let p = o; p; p = p.parent) if (p === lidNode || /Camera_Light/.test(p.name)) return true; return false; };
    meshes.forEach(o => {
      const lidPart = inLid(o); (lidPart ? (o.name === 'Object_8' || o.name === 'Object_9' ? SHELL : LID) : MAC).attach(o);
      const m = o.material; m.envMapIntensity = 1.1;
      if (o.name === 'Object_9') { // the logo: lit from inside
        LOGO = o; o.material = new THREE.MeshStandardMaterial({ color: 0xdfe3ea, metalness: 1, roughness: 0.05, envMapIntensity: 2.6, emissive: 0xffffff, emissiveIntensity: 0, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4, side: THREE.DoubleSide }); o.renderOrder = 2;
        o.geometry.computeBoundingBox(); return;
      }
      if (o.name === 'Object_7') { SCREEN_IMG = o; }
      const shellLike = /Space_Grey|Black_Plastic|Material.001|Keys/.test(m.name) || o.name === 'Object_8';
      if (shellLike) { SOLID.push(o); const gh = new THREE.Mesh(o.geometry, ghostMat()); gh.visible = false; o.add(gh); GHOST.push(gh); }
    });
    if (SCREEN_IMG) SCREEN_IMG.position.y -= 0.25;   // the screen picture sat on the black glass (z-fighting dots): move it 0.25 mm towards the viewer
    // logo centre in lid space
    const bb = new THREE.Box3().setFromObject(LOGO); LID.updateMatrixWorld(true); bb.getCenter(LOGO_C); LID.worldToLocal(LOGO_C); LOGO_C.y += 0.15;
    res();
  }));
}

/* ---------- V3 pieces: OLED pixel grid, the missing backlight, layer shadows, LED rings + light pools, light particles ---------- */
const PIX = { cv: document.createElement('canvas'), cols: 36, rows: 22, order: [] };
const RING = radial([[0, 'rgba(255,255,255,0)'], [0.62, 'rgba(255,240,215,0)'], [0.74, 'rgba(255,240,215,0.85)'], [0.86, 'rgba(255,240,215,0)'], [1, 'rgba(255,240,215,0)']], 256);

  const nb = new THREE.Mesh(new THREE.BoxGeometry(280, 0.2, 180), new THREE.MeshBasicMaterial({ color: 0x0a0b10, transparent: true, opacity: 0.55, depthWrite: false })); nb.position.set(0, 26, 104); NOBL.add(nb);

    const m = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.08, d * 1.08), new THREE.MeshBasicMaterial({ map: st, transparent: true, opacity: 0, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(g === REFL || g === DIFF ? LOGO_C.x : 0, y - 3.2, g === REFL || g === DIFF ? LOGO_C.z : 104); m.userData.shadow = true; g.add(m); });

  LEDS.forEach((L, i) => {

function flow(list, t, speed, a) { list.forEach(sp => { const P = sp.userData.pts, f = (t * speed + sp.userData.ph) % 1, segs = P.length - 1, x = f * segs, i = Math.min(segs - 1, Math.floor(x));

/* beams of light (additive tubes) */
function tube(a, b, r, col, op) { const d = b.clone().sub(a), len = Math.max(0.01, d.length()), g = new THREE.Group();

    m.userData.o = o; m.renderOrder = 10; g.add(m); }
  g.userData = { a: a.clone(), b: b.clone() }; return g; }
function setTube(g, k, a) { const { a: A, b: Bv } = g.userData, d = Bv.clone().sub(A), len = d.length() * clamp01(k); g.visible = a > 0.01 && len > 0.05;

function buildRays() {   // made in lid space; explode() moves their ends with the layers
  const g = new THREE.Group(); LID.add(g); RAYS.g = g;
  LEDS.forEach((L, i) => {
    for (let k = 0; k < 3; k++) {   // LED → across and down onto the mirror
      const hit = L.p.clone().add(new THREE.Vector3((k - 1) * 7, 0, 16 + k * 26)); hit.y = 5.15;
      const t1 = tube(L.p.clone().add(new THREE.Vector3(0, 0, 1.8)), hit, 0.4, 0xfff0d0, 0.75); g.add(t1); RAYS.led.push({ t: t1, i, k, hit });
    }
