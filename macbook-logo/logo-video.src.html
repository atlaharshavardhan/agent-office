/* beams of light (additive tubes) */
function tube(a, b, r, col, op) { const d = b.clone().sub(a), len = Math.max(0.01, d.length()), g = new THREE.Group();
  for (const [rr, o] of [[r, op], [r * 3.2, op * 0.18]]) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, 1, 10, 1, true), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.userData.o = o; m.renderOrder = 10; g.add(m); }
  g.userData = { a: a.clone(), b: b.clone() }; return g; }
function setTube(g, k, a) { const { a: A, b: Bv } = g.userData, d = Bv.clone().sub(A), len = d.length() * clamp01(k); g.visible = a > 0.01 && len > 0.05;
  g.children.forEach(m => { m.scale.set(1, Math.max(len, 0.01), 1); m.position.copy(A).addScaledVector(d.clone().normalize(), len / 2); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()); m.material.opacity = m.userData.o * a; }); }
const RAYS = { led: [], bounce: [], spread: [] };
function buildRays() {   // made in lid space for the exploded layout (see explode())
  const g = new THREE.Group(); LID.add(g); RAYS.g = g;
  LEDS.forEach((L, i) => {
    for (let k = 0; k < 3; k++) {   // LED → down onto the mirror
      const hit = L.p.clone().addScaledVector(L.dir, 16 + k * 11).add(new THREE.Vector3((k - 1) * 6 * L.dir.z, 0, (k - 1) * 6 * L.dir.x)); hit.y = 5.15;
      const t1 = tube(L.p.clone().setY(6.2), hit, 0.45, 0xfff0d0, 0.95); g.add(t1); RAYS.led.push({ t: t1, i, k, hit });
    }
  });
  RAYS.led.forEach(R => { const up = R.hit.clone(); up.y = 6.1; const t2 = tube(R.hit, up, 0.45, 0xfff6e6, 0.95); g.add(t2); RAYS.bounce.push({ t: t2, i: R.i, k: R.k, from: R.hit }); });
  for (let n = 0; n < 42; n++) {   // diffuser → logo window: many soft, even rays
    const a = n / 42 * Math.PI * 2 * 3.1, r = 8 + 30 * ((n * 37) % 42) / 42;
    const from = new THREE.Vector3(LOGO_C.x + Math.cos(a) * r * 0.9, 6.2, LOGO_C.z + Math.sin(a) * r * 0.9), to = new THREE.Vector3(LOGO_C.x + Math.cos(a) * r * 0.32, 7.0, LOGO_C.z + Math.sin(a) * r * 0.38);
    const t3 = tube(from, to, 0.28, 0xffffff, 0.5); g.add(t3); RAYS.spread.push({ t: t3, n });
  }
}

function explode(e) { EXPL = e; const k = ease(e);

  RAYS.g.children.forEach(() => {});
  // ray endpoints follow the layers
  RAYS.led.forEach(R => { R.t.userData.a.y = 6.2 + LAYER_Y.refl * k; R.t.userData.b.y = 5.15 + LAYER_Y.refl * k; });
  RAYS.bounce.forEach(R => { R.t.userData.a.y = 5.15 + LAYER_Y.refl * k; R.t.userData.b.y = 6.1 + LAYER_Y.diff * k - 0.6; });
  RAYS.spread.forEach(R => { R.t.userData.a.y = 6.7 + LAYER_Y.diff * k; R.t.userData.b.y = 7.0 + LAYER_Y.shell * k; });

function setXray(x) {

}

/* ---------- overlays ---------- */
let lastTitle = '';
function title(lines, times, u) {
  const k = lines.join('|'); if (k !== lastTitle) { lastTitle = k; $('title').innerHTML = lines.map(l => `<span class="ln">${l}</span>`).join(''); }
  [...$('title').children].forEach((el, i) => { const a = easeOut(ramp(u, times[i], times[i] + 0.35)); el.style.opacity = a; el.style.transform = `translateY(${(1 - a) * 2.2}vh)`; });
}
function note(text, a) { $('note').textContent = text; $('note').style.opacity = a; }
const TAGS = {}; const svg = $('lines');
function tagEl(id, text, cls) { if (!TAGS[id]) { const el = document.createElement('div'); el.className = 'tag'; document.body.appendChild(el);
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'), c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); svg.append(l, c); TAGS[id] = { el, l, c }; }
  const T = TAGS[id]; if (T.el.textContent !== text) T.el.textContent = text; T.el.className = 'tag ' + (cls || ''); return T; }
function proj(v) { const p = v.clone().project(camera); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; }
const COLS = { red: '#ff3b55', acc: '#8fdcff', green: '#2fd36b' };
function sideTags(list) { // callouts in the side margins: [id, text, worldPoint, side(-1 left / 1 right), alpha, cls]
  const gap = H * 0.052, cols = { '-1': [], '1': [] };
  list.forEach(L => { const [x, y] = proj(L[2]); cols[L[3]].push({ L, x, y, ty: Math.min(H * 0.62, Math.max(H * 0.25, y)) }); });
  for (const k in cols) { const c = cols[k].filter(o => o.L[4] > 0.01).sort((a, b) => a.ty - b.ty); for (let i = 1; i < c.length; i++) c[i].ty = Math.max(c[i].ty, c[i - 1].ty + gap);
    if (k === '1') c.forEach(o => { if (o.ty > H * 0.43 && o.ty < H * 0.57) o.ty = o.ty < H * 0.5 ? H * 0.425 : H * 0.575; }); }   // keep clear of the right-middle watermark

    const edge = side < 0 ? W * 0.04 : W * 0.96; T.el.style.left = edge + 'px'; T.el.style.top = ty + 'px'; T.el.style.opacity = a;

  });
}
