{

/* ---------- the MacBook: "Macbook Pro 13 inch 2020" by timblewee (CC BY 4.0), modified ---------- */
// Units: mm. The model comes closed; the lid (node "Bevels_2") hinges at (0, 8, -104). LID is that pivot.
// Lid-local frame (lid closed): +y = outward (the back of the lid, where the logo is), screen faces -y, +z runs from hinge to top edge.
const MAC = new THREE.Group(); scene.add(MAC);
const LID = new THREE.Group(); LID.position.set(0, 8, -104); MAC.add(LID);
const SHELL = new THREE.Group(); LID.add(SHELL);           // aluminium lid back + logo: moves out when the lid opens up into layers

function loadMac() {
  return new Promise(res => new THREE.GLTFLoader().parse(window.MBP_GLTF, '', g => {
    const root = g.scene; root.scale.setScalar(1000); MAC.add(root); root.updateMatrixWorld(true);
    const lidNode = root.getObjectByName('Bevels_2'), meshes = []; root.traverse(o => { if (o.isMesh) meshes.push(o); });
    const inLid = o => { for (let p = o; p; p = p.parent) if (p === lidNode || /Camera_Light/.test(p.name)) return true; return false; };
    meshes.forEach(o => {
      const lidPart = inLid(o); (lidPart ? (o.name === 'Object_8' || o.name === 'Object_9' ? SHELL : LID) : MAC).attach(o);
      const m = o.material; m.envMapIntensity = 1.1;
      if (o.name === 'Object_9') { // the logo: lit from inside

        o.geometry.computeBoundingBox(); return;
      }
      if (o.name === 'Object_7') { SCREEN_IMG = o; }
      const shellLike = /Space_Grey|Black_Plastic|Material.001|Keys/.test(m.name) || o.name === 'Object_8';
      if (shellLike) { SOLID.push(o); const gh = new THREE.Mesh(o.geometry, ghostMat()); gh.visible = false; o.add(gh); GHOST.push(gh); }
    });

    meshes.forEach(o => { if (/^Object_(23|24|25|27)$/.test(o.name)) o.visible = false; });   // V4: the 2026 MacBook Pro has no Touch Bar (viewers spot it)
    buildFnRow();   // the screen picture sat on the black glass (z-fighting dots): move it 0.25 mm towards the viewer
    // logo centre in lid space
    const bb = new THREE.Box3().setFromObject(LOGO); LID.updateMatrixWorld(true); bb.getCenter(LOGO_C); LID.worldToLocal(LOGO_C); LOGO_C.y += 0.15;

}

/* V4: full-height function row (esc, F1–F12, Touch ID) where the 2020 model had its Touch Bar */

    else if (i === 3) { for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) c.strokeRect(cx + dx * r * 0.62 - r * 0.45, cy + dy * r * 0.45 - r * 0.3, r * 0.9, r * 0.6); }

    else if (i === 6) { c.beginPath(); c.arc(cx, cy, r * 0.75, 0.6, 2 * Math.PI - 0.6); c.arc(cx + r * 0.45, cy, r * 0.55, 2 * Math.PI - 1.35, 1.35, true); c.closePath(); c.fill(); }
    else if (i === 7) { tri(cx, -1); tri(cx + r * 0.9, -1); }
    else if (i === 8) { tri(cx - r * 0.9, 1); c.fillRect(cx + r * 0.25, cy - r * 0.6, r * 0.22, r * 1.2); c.fillRect(cx + r * 0.62, cy - r * 0.6, r * 0.22, r * 1.2); }
