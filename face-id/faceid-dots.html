<title>Face ID dots</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 80% at 50% 35%,#9fe1ff 0%,#4a95f2 50%,#1c4cc0 100%)}
  canvas{display:block}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const W = innerWidth, H = innerHeight, TOTAL = 5;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);

/* ---------- lights: soft studio ---------- */
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x30508a, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(4, 5, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xbfe2ff, 0.35); fill.position.set(-5, 0, 4); scene.add(fill);
const rim = new THREE.DirectionalLight(0xdff2ff, 0.9); rim.position.set(-3, 3, -5); scene.add(rim);

/* ---------- clay head (sculpted sphere) ---------- */
const g = (a, s) => Math.exp(-a * a / (s * s));
const headGeo = new THREE.SphereGeometry(1, 180, 140);
const p = headGeo.attributes.position, v = new THREE.Vector3();
for (let i = 0; i < p.count; i++) {
  v.fromBufferAttribute(p, i);
  let { x, y, z } = v;
  const f = Math.max(0, z), ax = Math.abs(x);
  if (y < -0.1) { const q = Math.min(1, (-0.1 - y) / 0.9); x *= 1 - 0.34 * q * q * (3 - 2 * q); }   // jaw taper
  if (y > 0.35) { z -= 0.06 * (y - 0.35); }                                         // forehead slopes back
  let d = 0;
  d += 0.30 * g(x, 0.08) * g(y + 0.06, 0.17) * f;           // nose bridge + body
  d += 0.07 * g(x, 0.06) * g(y + 0.25, 0.05) * f;           // nose tip
  d += 0.04 * g(ax - 0.07, 0.035) * g(y + 0.27, 0.035) * f; // nostrils
  d += 0.06 * g(y - 0.25, 0.07) * g(x, 0.42) * f;           // brow ridge
  d -= 0.09 * g(ax - 0.29, 0.12) * g(y - 0.1, 0.09) * f;    // eye sockets
  d += 0.065 * g(ax - 0.29, 0.085) * g(y - 0.09, 0.055) * f; // closed eyes / lids
  d -= 0.012 * g(ax - 0.29, 0.09) * g(y - 0.075, 0.008) * f; // lid line
  d += 0.055 * g(ax - 0.47, 0.13) * g(y + 0.07, 0.11) * f;  // cheekbones
  d += 0.045 * g(x, 0.15) * g(y + 0.49, 0.045) * f;         // upper lip
  d -= 0.022 * g(x, 0.16) * g(y + 0.545, 0.013) * f;        // mouth line
  d += 0.04 * g(x, 0.14) * g(y + 0.61, 0.045) * f;          // lower lip
  d += 0.08 * g(x, 0.2) * g(y + 0.86, 0.1) * f;             // chin
  const r = 1 + d;
  p.setXYZ(i, x * 0.78 * r, y * 1.06 * r, z * 0.92 * r);
}
headGeo.computeVertexNormals();
const clay = new THREE.MeshStandardMaterial({ color: 0xdfe7f2, roughness: 0.55, metalness: 0.05 });
const head = new THREE.Mesh(headGeo, clay);
const earGeo = new THREE.SphereGeometry(0.17, 32, 24);
const earL = new THREE.Mesh(earGeo, clay), earR = new THREE.Mesh(earGeo, clay);
earL.scale.set(0.4, 1, 0.75); earR.scale.set(0.4, 1, 0.75);
earL.position.set(-0.77, 0.0, -0.08); earR.position.set(0.77, 0.0, -0.08);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.44, 0.8, 48), clay);
neck.position.set(0, -1.15, -0.15);
const shoulders = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), clay);
shoulders.scale.set(1.75, 0.72, 0.8); shoulders.position.set(0, -1.95, -0.25);
const headGroup = new THREE.Group();
headGroup.add(head, earL, earR, neck, shoulders);
headGroup.position.set(0.25, 0.55, 0);
headGroup.rotation.set(0.12, -0.32, 0);   // turned toward the phone, looking slightly down
scene.add(headGroup);

/* ---------- iPhone, screen facing the face ---------- */
function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
const phone = new THREE.Group();
const body = new THREE.Mesh(new THREE.ExtrudeGeometry(roundedRect(0.74, 1.56, 0.12), { depth: 0.07, bevelEnabled: true, bevelThickness: 0.014, bevelSize: 0.014, bevelSegments: 4, curveSegments: 16 }),
  new THREE.MeshStandardMaterial({ color: 0x8d939e, roughness: 0.38, metalness: 0.35 }));
body.position.z = -0.07;
const screenMat = new THREE.MeshStandardMaterial({ color: 0x0a1426, emissive: 0x1f5fc0, emissiveIntensity: 0.5, roughness: 0.12 });
const screen = new THREE.Mesh(new THREE.ShapeGeometry(roundedRect(0.69, 1.51, 0.1), 16), screenMat);
screen.position.z = 0.0155;
const island = new THREE.Mesh(new THREE.ShapeGeometry(roundedRect(0.22, 0.065, 0.032), 12), new THREE.MeshBasicMaterial({ color: 0x000000 }));
island.position.set(0, 0.66, 0.017);
const emitterDot = new THREE.Mesh(new THREE.CircleGeometry(0.013, 16), new THREE.MeshBasicMaterial({ color: 0xe2b8ff }));
emitterDot.position.set(0.055, 0.66, 0.018);
const glyph = new THREE.Group();
const gm = new THREE.LineBasicMaterial({ color: 0x9fe8ff });
for (const sx of [-1, 1]) for (const sy of [-1, 1])
  glyph.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(sx * 0.12, sy * 0.05, 0), new THREE.Vector3(sx * 0.12, sy * 0.12, 0), new THREE.Vector3(sx * 0.05, sy * 0.12, 0)]), gm));
glyph.position.set(0, 0.12, 0.018);
const bumpMat = new THREE.MeshStandardMaterial({ color: 0x7c828d, roughness: 0.3, metalness: 0.4 });
const bump = new THREE.Mesh(new THREE.ExtrudeGeometry(roundedRect(0.3, 0.3, 0.07), { depth: 0.02, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2 }), bumpMat);
bump.position.set(-0.17, 0.55, -0.106);
const lensMat = new THREE.MeshStandardMaterial({ color: 0x0c0f16, roughness: 0.1, metalness: 0.6 });
const lenses = new THREE.Group();
for (const [lx, ly] of [[-0.24, 0.62], [-0.24, 0.48], [-0.1, 0.55]]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.03, 32), lensMat); l.rotation.x = Math.PI / 2; l.position.set(lx, ly, -0.12); lenses.add(l); }
phone.add(body, screen, island, emitterDot, glyph, bump, lenses);
phone.position.set(-0.42, -1.3, 1.75);
phone.lookAt(new THREE.Vector3(0.25, 0.6, 0.4));
scene.add(phone);

scene.updateMatrixWorld(true);
const emitter = new THREE.Vector3(); emitterDot.getWorldPosition(emitter);

/* ---------- dot pattern: jittered grid raycast from the emitter onto the face ---------- */
const targets = [head, earL, earR, neck];
const ray = new THREE.Raycaster();
const faceCenter = new THREE.Vector3(0, 0.05, 0.6); head.localToWorld(faceCenter);
const fwd = faceCenter.clone().sub(emitter).normalize();
const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize(), up = new THREE.Vector3().crossVectors(right, fwd).normalize();
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hits = []; const N = 90;
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  const a = (i / (N - 1) - 0.5) * 0.48 + (rnd() - 0.5) * 0.005, b = (j / (N - 1) - 0.5) * 0.6 + (rnd() - 0.5) * 0.005;
  ray.set(emitter, fwd.clone().addScaledVector(right, a).addScaledVector(up, b).normalize());
  const h = ray.intersectObjects(targets, false)[0];
  if (h && h.object !== neck && rnd() < 0.3) hits.push(h.point.clone().addScaledVector(h.face.normal.clone().transformDirection(h.object.matrixWorld), 0.008));
}
const M = hits.length;
let ymin = Infinity, ymax = -Infinity; for (const h of hits) { ymin = Math.min(ymin, h.y); ymax = Math.max(ymax, h.y); }
const launch = new Float32Array(M), travel = 0.4;
for (let i = 0; i < M; i++) launch[i] = 0.4 + 1.5 * (hits[i].y - ymin) / (ymax - ymin) + rnd() * 0.15;

function dotTexture(core) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, core); gr.addColorStop(0.35, 'rgba(176,96,255,0.95)'); gr.addColorStop(0.7, 'rgba(150,70,255,0.25)'); gr.addColorStop(1, 'rgba(140,60,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const dotGeo = new THREE.BufferGeometry();
const dpos = new Float32Array(M * 3), dal = new Float32Array(M);
dotGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
dotGeo.setAttribute('alpha', new THREE.BufferAttribute(dal, 1));
const dotMat = new THREE.ShaderMaterial({
  uniforms: { map: { value: dotTexture('rgba(255,235,255,1)') }, size: { value: 0.036 * H } },
  vertexShader: 'attribute float alpha; varying float va; uniform float size; void main(){ va = alpha; vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = size * (0.9 + 0.5*max(alpha-1.0,0.0)) / -mv.z; gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'uniform sampler2D map; varying float va; void main(){ vec4 c = texture2D(map, gl_PointCoord); gl_FragColor = vec4(c.rgb * (0.85 + 0.25*max(va-1.0,0.0)), c.a * min(va,1.0)); }',
  transparent: true, depthWrite: false,
});
const dots = new THREE.Points(dotGeo, dotMat); dots.frustumCulled = false; scene.add(dots);

/* ---------- beams: glowing tubes (bright core + soft glow) ---------- */
const NB = 36, beamTarget = [], beamsCore = [], beamsGlow = [];
for (let i = 0; i < NB; i++) beamTarget.push(hits[Math.floor(rnd() * M)]);
const coreGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1, true), glowGeo = new THREE.CylinderGeometry(1, 1, 1, 12, 1, true);
const yAxis = new THREE.Vector3(0, 1, 0);
for (let i = 0; i < NB; i++) {
  const tg = beamTarget[i], dir = tg.clone().sub(emitter), len = dir.length();
  const q = new THREE.Quaternion().setFromUnitVectors(yAxis, dir.clone().normalize());
  const mid = emitter.clone().lerp(tg, 0.5);
  const core = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: 0xffeaff, transparent: true, opacity: 0, depthWrite: false }));
  core.scale.set(0.0045, len, 0.0045); core.position.copy(mid); core.quaternion.copy(q);
  const glow = new THREE.Mesh(glowGeo, new THREE.MeshBasicMaterial({ color: 0xb06cff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.scale.set(0.016, len, 0.016); glow.position.copy(mid); glow.quaternion.copy(q);
  scene.add(glow, core); beamsCore.push(core); beamsGlow.push(glow);
}
const coneLen = faceCenter.distanceTo(emitter);
const cone = new THREE.Mesh(new THREE.ConeGeometry(0.75, coneLen, 48, 1, true),
  new THREE.MeshBasicMaterial({ color: 0xc9a2ff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
cone.position.copy(emitter).lerp(faceCenter, 0.5);
cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), fwd);
scene.add(cone);
const flare = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTexture('rgba(255,255,255,1)'), transparent: true, depthWrite: false }));
flare.position.copy(emitter); scene.add(flare);

/* ---------- animation ---------- */
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const camA = { pos: new THREE.Vector3(1.35, -0.35, 8.2), look: new THREE.Vector3(-0.2, -0.35, 0.9) };
const camB = { pos: new THREE.Vector3(1.05, -0.1, 6.9), look: new THREE.Vector3(-0.1, -0.15, 0.8) };
const tmp = new THREE.Vector3(), look = new THREE.Vector3();
function renderAt(t) {
  const c = ease(t / TOTAL);
  camera.position.lerpVectors(camA.pos, camB.pos, c); look.lerpVectors(camA.look, camB.look, c); camera.lookAt(look);
  const on = ease((t - 0.15) / 0.3) * (1 - 0.65 * ease((t - 3.6) / 1.0));
  for (let i = 0; i < NB; i++) {
    const fl = 0.7 + 0.3 * Math.sin(t * 19 + i * 2.7) * Math.sin(t * 5.3 + i * 1.3);
    const k = on * fl;
    beamsCore[i].material.opacity = 0.95 * k; beamsGlow[i].material.opacity = 0.45 * k;
  }
  cone.material.opacity = 0.12 * on;
  flare.scale.setScalar(0.14 + 0.08 * on + 0.025 * Math.sin(t * 30)); flare.material.opacity = 0.3 + 0.7 * on;
  for (let i = 0; i < M; i++) {
    const u = (t - launch[i]) / travel, h = hits[i];
    let a = 0;
    if (u <= 0) { tmp.copy(emitter); a = 0; }
    else if (u < 1) { tmp.copy(emitter).lerp(h, u * u * (3 - 2 * u)); a = 0.7; }
    else {
      tmp.copy(h);
      const pop = Math.exp(-(u - 1) * 3.5);
      const wave = t > 3.0 ? Math.max(0, Math.sin((t - 3.0) * 4.0 - (h.y - ymin) * 3.0)) * ease((t - 3.0) / 0.3) : 0;
      a = 1 + 0.9 * pop + 0.9 * wave;
    }
    dpos[i * 3] = tmp.x; dpos[i * 3 + 1] = tmp.y; dpos[i * 3 + 2] = tmp.z; dal[i] = a;
  }
  dotGeo.attributes.position.needsUpdate = dotGeo.attributes.alpha.needsUpdate = true;
  screenMat.emissiveIntensity = 0.45 + 0.2 * on;
  renderer.render(scene, camera);
}
window.__tour = { total: TOTAL, renderAt };
window.__dotCount = M;
if (!/render=1/.test(location.search)) { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); }; loop(); }
else renderAt(0);
})();
</script>
