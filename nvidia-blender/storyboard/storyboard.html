<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: InterD; src: url(../assets/fonts/InterDisplay-Bold.otf); font-weight: 800; }
  :root { --g: #76B900; --r: #E5484D; --s: #BFC5CC; --gold: #C49A52; --bg: #07090B; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: Inter, sans-serif; color: #fff; position: relative; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .bg.blur { filter: blur(26px) brightness(.32) saturate(1.2); transform: scale(1.1); }
  .vign { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(0,0,0,.6)); }
  /* Reel safe zones: title 220-450, subject 450-1500, subtitles 1250-1450 */
  .title { position: absolute; left: 60px; right: 60px; top: 236px; text-align: center; }
  .title h1 { font: 800 92px/1 InterD, Inter; letter-spacing: -2px; text-shadow: 0 6px 30px rgba(0,0,0,.7); }
  .title h1 .r { color: var(--r); } .title h1 .g { color: var(--g); }
  .title p { margin-top: 18px; font: 600 38px Inter; color: rgba(255,255,255,.82); text-shadow: 0 3px 14px #000; }
  .sub { position: absolute; left: 80px; right: 150px; top: 1270px; height: 170px; display: flex; align-items: center; justify-content: center; text-align: center;
         font: 700 50px/1.18 Inter; text-shadow: 0 0 6px #000, 0 3px 12px #000, 0 0 2px #000; }
  .sub b { color: #FFD54A; }
  .disc { position: absolute; left: 60px; top: 1458px; font: 500 22px Inter; color: rgba(255,255,255,.55); }
  .src { position: absolute; left: 70px; top: 1190px; font: 600 24px Inter; color: rgba(255,255,255,.7); background: rgba(0,0,0,.5); padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); }
  .wm { position: absolute; right: 22px; top: 960px; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: .8; }
  .wm img { width: 54px; height: 54px; border-radius: 50%; }
  .wm span { writing-mode: vertical-rl; font: 700 22px Inter; letter-spacing: 1px; color: rgba(255,255,255,.85); text-shadow: 0 1px 6px #000; }
  .panel { position: absolute; left: 70px; right: 140px; top: 480px; height: 690px; border-radius: 40px; background: linear-gradient(160deg, rgba(28,32,38,.88), rgba(10,12,15,.92));
           border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); padding: 46px; }
  .label { font: 600 28px 'Inter'; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.55); }
  svg text { font-family: Inter; }
  .scn { position: absolute; left: 24px; top: 24px; font: 700 24px Inter; color: rgba(255,255,255,.35); }
  .zones .z { position: absolute; left: 0; right: 0; border-top: 2px dashed rgba(0,255,255,.6); font: 600 20px Inter; color: cyan; }
</style></head>
<body>
<div id="root"></div>
<script src="characters.js"></script>
<script>
const q = new URLSearchParams(location.search), S = +q.get('s') || 1, ZONES = q.get('zones') === '1';
const R = document.getElementById('root');
const html = (s) => R.insertAdjacentHTML('beforeend', s);
const bg = (f, blur, dy = 0) => html(`<div class="bg ${blur ? 'blur' : ''}" style="background-image:url(bg/${f});top:${-dy}px;bottom:${dy}px"></div><div class="vign"></div><div style="position:absolute;left:0;right:0;bottom:0;height:${dy ? dy + 260 : 0}px;background:linear-gradient(transparent,#07090B 260px)"></div>`);
const title = (h, p = '') => html(`<div class="title"><h1>${h}</h1>${p ? `<p>${p}</p>` : ''}</div>`);
const sub = (t) => html(`<div class="sub"><div>${t}</div></div>`);
const disc = () => html(`<div class="disc">3D illustration · not affiliated with NVIDIA</div>`);
const src = (t) => html(`<div class="src">${t}</div>`);

// market cap ($T): verified anchors from research/FACT-SHEET.md
const CAP = [['Jun 24', 3.34], ['Sep 24', 2.7], ['Jan 25', 3.66], ['Apr 25', 2.3], ['Jul 25', 4.0], ['Oct 25', 5.03],
             ['Feb 26', 4.6], ['Jun 26', 5.2], ['Oct 6', 5.77]];
const DROP = [['Oct 6', 5.77], ['Nov 4', 4.82], ['Nov 5', 4.38], ['Nov 6', 4.5], ['Nov 9', 4.31], ['Nov 10', 4.07], ['Nov 12', 3.95], ['Nov 13', 3.92]];

function graph(pts, { w = 800, h = 560, min = 0, max = 6.5, color = 'var(--g)', redFrom = 99, marks = [], line4 = false, label = '', few = false } = {}) {
  const X = (i) => 60 + i * (w - 120) / (pts.length - 1), Y = (v) => h - 60 - (v - min) / (max - min) * (h - 110);
  let d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i)},${Y(p[1])}`).join(' ');
  let g = '', red = '';
  if (redFrom < pts.length) red = pts.slice(redFrom).map((p, i) => `${i ? 'L' : 'M'}${X(i + redFrom)},${Y(p[1])}`).join(' ');
  for (let v = Math.ceil(min); v <= max; v++) g += `<line x1="50" x2="${w - 20}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.08)"/><text x="0" y="${Y(v) + 8}" fill="rgba(255,255,255,.45)" font-size="24">$${v}T</text>`;
  const last = pts.length - 1;
  const area = `${d} L${X(last)},${h - 60} L${X(0)},${h - 60} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76B900" stop-opacity=".35"/><stop offset="1" stop-color="#76B900" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${g}${line4 ? `<line x1="50" x2="${w - 20}" y1="${Y(4)}" y2="${Y(4)}" stroke="var(--r)" stroke-dasharray="10 8" stroke-width="3"/><text x="${w - 150}" y="${Y(4) - 12}" fill="var(--r)" font-size="26" font-weight="700">$4T line</text>` : ''}
    <path d="${area}" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="7" stroke-linejoin="round" filter="url(#glow)"/>
    ${red ? `<path d="${red}" fill="none" stroke="var(--r)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>` : ''}
    ${pts.map((p, i) => (i === 0 || i === last || (!few && i % 2 === 0)) ? `<text x="${X(i)}" y="${h - 18}" fill="rgba(255,255,255,.5)" font-size="22" text-anchor="middle">${p[0]}</text>` : '').join('')}
    ${marks.map(([i, t]) => `<circle cx="${X(i)}" cy="${Y(pts[i][1])}" r="16" fill="var(--r)" filter="url(#glow)"/><text x="${X(i)}" y="${Y(pts[i][1]) + 8}" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">${t}</text>`).join('')}
    ${label}
  </svg>`;
}

const scenes = {
  1() { bg('hook58.png', 0, 170); title('<span class="r">−$1.8 TRILLION</span>', 'NVIDIA’s value · Oct 6 → Nov 13, 2026'); disc();
        sub('In five weeks, NVIDIA’s value fell by <b>1.8 trillion dollars.</b>'); },
  2() { bg('hook24.png', 1); title('Almost <span class="r">HALF</span> of India', 'India’s yearly GDP vs NVIDIA’s lost value');
        html(`<div class="panel" style="display:flex;align-items:flex-end;justify-content:space-around;padding-bottom:50px">
          <div style="text-align:center"><div style="font:800 64px InterD">$4.15T</div><div style="width:230px;height:430px;margin:18px auto;border-radius:22px 22px 6px 6px;background:linear-gradient(#FF9933,#fff 50%,#138808)"></div><div class="label">India · 1 year GDP</div></div>
          <div style="text-align:center"><div style="font:800 64px InterD;color:var(--r)">$1.8T</div><div style="width:230px;height:187px;margin:18px auto;border-radius:22px 22px 6px 6px;background:linear-gradient(var(--r),#5a0f12);box-shadow:0 0 60px rgba(229,72,77,.5)"></div><div class="label">NVIDIA lost value</div></div></div>
          <div style="position:absolute;left:70px;right:140px;top:1192px;text-align:center;font:600 28px Inter;color:rgba(255,255,255,.6)">≈ ₹164 lakh crore at ₹91 / $ · IMF WEO Apr 2026</div>`);
        sub('That’s almost half of India’s yearly economy, <b>wiped off its share price.</b> How?'); },
  3() { html(`<div class="bg" style="background-image:url(../renders/stills/scene03_datacenter.png)"></div>`); title('The chips <span class="g">AI runs on</span>'); disc();
        sub('NVIDIA makes the chips AI runs on, like <b>ChatGPT.</b>'); },
  4() { bg('hook24.png', 1); title('<span class="g">$5.8T</span> record', 'World’s most valuable company · Oct 6, 2026');
        html(`<div class="panel"><div class="label">NVIDIA market value</div>${graph(CAP, { h: 520, label: `<text x="610" y="70" fill="#76B900" font-size="44" font-weight="800">$5.8T</text>` })}</div>`);
        sub('Everyone wanted them. By October, NVIDIA hit a record <b>5.8 trillion.</b>'); },
  5() { bg('hook24.png', 1); title('Then: <span class="r">3 shocks</span>', 'within five weeks');
        html(`<div class="panel"><div class="label">Oct 6 → Nov 13, 2026</div>${graph(DROP, { h: 520, min: 3, max: 6.2, redFrom: 0, marks: [[2, '1'], [4, '2'], [6, '3']] })}</div>`);
        sub('Then, <b>three shocks.</b>'); },
  6() { bg('hook24.png', 1); title('<span class="r">1</span> · New local rules', 'on AI data centres');
        const P = (o) => person(o);
        html(`<div class="panel" style="padding:0;overflow:hidden"><svg width="870" height="690" viewBox="0 0 870 690">
          <defs><radialGradient id="fl" cx=".5" cy=".9" r=".7"><stop offset="0" stop-color="#2a3140"/><stop offset="1" stop-color="#0c0f14"/></radialGradient></defs>
          <rect width="870" height="690" fill="url(#fl)"/>
          <!-- ballot box -->
          <g transform="translate(300,430)"><rect x="-90" y="0" width="180" height="150" rx="10" fill="#d9dde3"/><rect x="-90" y="0" width="180" height="30" fill="#b9bfc8"/><rect x="-45" y="8" width="90" height="12" rx="4" fill="#20242b"/>
            <text x="0" y="100" text-anchor="middle" font-size="30" font-weight="800" fill="#20242b">VOTE</text></g>
          ${P({ x: 140, y: 600, s: .78, pose: 'stand', outfit: 'casual', skin: '#e2b896', hair: '#6b4a2b', rim: '#E5484D' })}
          ${P({ x: 300, y: 450, s: .5, pose: 'vote', outfit: 'blazer', skin: '#8a5a3c', hairStyle: 'long', rim: '#E5484D', prop: 'ballot' })}
          ${P({ x: 460, y: 610, s: .8, pose: 'stand', outfit: 'hoodie', skin: '#c48f68', rim: '#E5484D', flip: true })}
          <!-- paused rack -->
          <g transform="translate(700,150)"><rect x="-80" y="0" width="160" height="440" rx="10" fill="#0b0d10" stroke="#2c3138" stroke-width="3"/>
            ${Array.from({ length: 14 }, (_, i) => `<rect x="-66" y="${18 + i * 30}" width="132" height="22" rx="3" fill="#161a20"/><circle cx="52" cy="${29 + i * 30}" r="4" fill="${i % 3 ? '#3a1416' : '#E5484D'}"/>`).join('')}
            <g transform="rotate(-14)"><rect x="-108" y="170" width="190" height="64" rx="10" fill="none" stroke="#E5484D" stroke-width="7"/><text x="-13" y="217" text-anchor="middle" font-size="38" font-weight="900" fill="#E5484D">PAUSED</text></g></g>
          <text x="435" y="660" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">Fewer data centres <tspan fill="#E5484D">→ fewer chips</tspan></text></svg></div>`);
        src('Nov 5: −9% in one day · CNBC: fall came after the US midterms'); sub('One: US voters passed local rules that could slow new data centres. <b>Fewer centres, fewer chips.</b>'); },
  7() { bg('hook24.png', 1); title('<span class="r">2</span> · The money loop');
        const node = (x, y, t, c) => `<g transform="translate(${x},${y})"><circle r="92" fill="#11151a" stroke="${c}" stroke-width="5"/><text text-anchor="middle" y="12" font-size="32" font-weight="800" fill="#fff">${t}</text></g>`;
        html(`<div class="panel" style="padding:0;overflow:hidden"><svg width="870" height="690" viewBox="0 0 870 690"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#76B900"/></marker><marker id="arr" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#E5484D"/></marker></defs>
          <path d="M520,120 Q720,170 720,330" fill="none" stroke="#76B900" stroke-width="6" marker-end="url(#ar)"/><text x="690" y="170" fill="#fff" font-size="27" font-weight="700">invests $</text>
          <path d="M560,520 Q440,600 330,560" fill="none" stroke="#76B900" stroke-width="6" marker-end="url(#ar)"/><text x="360" y="640" fill="#fff" font-size="27" font-weight="700">buys chips</text>
          <path d="M170,450 Q120,250 300,140" fill="none" stroke="#E5484D" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#arr)"/><text x="18" y="270" fill="#E5484D" font-size="27" font-weight="800">orders stop?</text>
          <g transform="translate(150,300)"><circle r="26" fill="#E5484D"/><path d="M-10,-10 L10,10 M10,-10 L-10,10" stroke="#fff" stroke-width="5"/></g>
          ${node(420, 110, 'NVIDIA', '#76B900')}${node(240, 520, 'Chip orders', '#C49A52')}
          <g transform="translate(700,330)"><circle r="150" fill="rgba(191,197,204,.06)" stroke="#BFC5CC" stroke-width="4"/></g>
          ${person({ x: 700, y: 460, s: .55, pose: 'laptop', outfit: 'hoodie', skin: '#a8714c', prop: 'laptop', rim: '#76B900' })}
          <text x="700" y="520" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">AI start-up</text></svg></div>`);
        src('BofA est.: ~$70B stakes + ~$230B guarantees · CNBC, Aug 2026'); sub('Two: NVIDIA invests in AI start-ups that buy its chips. <b>If that money stops, orders stop.</b>'); },
  8() { bg('hook24.png', 1); title('<span class="r">3</span> · The CEO walks out', 'Co-founder · led NVIDIA for 33 years (1993–2026)');
        html(`<div class="panel" style="overflow:hidden;padding:0"><svg width="870" height="690" viewBox="0 0 870 690">
          <defs><radialGradient id="sp" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f26"/><stop offset="1" stop-color="#07080a"/></linearGradient></defs>
          <rect y="520" width="870" height="170" fill="url(#stage)"/>
          <polygon points="250,0 380,0 520,560 110,560" fill="url(#sp)"/><ellipse cx="315" cy="560" rx="200" ry="34" fill="rgba(255,255,255,.12)"/>
          <g transform="translate(315,560) scale(.9)" fill="#030405" stroke="rgba(255,255,255,.3)" stroke-width="2"><rect x="-80" y="-330" width="160" height="200" rx="36"/><rect x="-105" y="-150" width="210" height="52" rx="24"/>
            <rect x="-9" y="-98" width="18" height="70"/><path d="M-90,-10 L0,-32 L90,-10" fill="none" stroke-width="12" stroke="#111"/></g>
          ${person({ x: 700, y: 610, s: .82, pose: 'walk', outfit: 'jacket', skin: '#c99872', hairStyle: 'grey', rim: '#E5484D', flip: true, alpha: .92 })}
          <g transform="translate(30,30)"><rect width="270" height="92" rx="16" fill="rgba(229,72,77,.16)" stroke="#E5484D" stroke-width="3"/>
            <text x="135" y="44" text-anchor="middle" font-size="38" font-weight="900" fill="#E5484D">−$600B</text><text x="135" y="76" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">at the opening bell · Nov 12</text></g></svg></div>`);
        src('Stepped down amid a board investigation · Bloomberg, CNBC, City AM'); sub('Three: CEO Jensen Huang, who led NVIDIA for 33 years, stepped down. <b>About 600 billion vanished at the opening bell.</b>'); },
  9() { bg('hook24.png', 1); title('<span class="g">Bubble?</span> or <span class="r">correction?</span>');
        html(`<div class="panel" style="display:flex;gap:10px;padding:30px">
          <div style="flex:1.25"><div class="label" style="color:var(--r)">Investors</div><svg width="440" height="600" viewBox="0 0 500 600">
            ${person({ x: 110, y: 560, s: .9, pose: 'phone', outfit: 'suit', skin: '#b98260', prop: 'phone', rim: '#E5484D' })}
            ${person({ x: 270, y: 520, s: .75, pose: 'panic', outfit: 'blazer', skin: '#e0b090', hairStyle: 'long', hair: '#3b2416', rim: '#E5484D' })}
            ${person({ x: 400, y: 570, s: .88, pose: 'phone', outfit: 'kurta', skin: '#8d5b3d', prop: 'phone', rim: '#E5484D', flip: true })}</svg></div>
          <div style="flex:1"><div class="label" style="color:var(--g)">Sales (quarter)</div>
            <div style="display:flex;align-items:flex-end;gap:20px;height:430px;margin-top:40px">
              <div style="flex:1;text-align:center"><div style="font:800 32px InterD">$46.7B</div><div style="height:150px;background:rgba(118,185,0,.45);border-radius:12px 12px 4px 4px;margin-top:8px"></div><div class="label" style="margin-top:10px;font-size:22px">Aug 2025</div></div>
              <div style="flex:1;text-align:center"><div style="font:800 32px InterD;color:var(--g)">$96.2B</div><div style="height:310px;background:var(--g);border-radius:12px 12px 4px 4px;margin-top:8px;box-shadow:0 0 50px rgba(118,185,0,.45)"></div><div class="label" style="margin-top:10px;font-size:22px">Aug 2026</div></div></div>
            <div style="font:800 46px InterD;color:var(--g);margin-top:22px;text-align:center">+106%</div></div></div>`);
        sub('Bubble? Sales still <b>doubled.</b> Investors fear it won’t last.'); },
  10() { bg('hook90.png', 0, 420); title('A <span class="r">bet</span>, not the business', 'Share price = what investors expect next'); disc();
        sub('A share price is a bet. <b>The bet flipped, not the business.</b>'); },
  11() { bg('hook90.png', 1);
        html(`<div style="position:absolute;left:86px;right:172px;top:451px;height:663px;border-radius:54px;overflow:hidden;border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.6)">
          <div style="position:absolute;inset:0;background:url(bg/hook90.png) center 65%/cover"></div>
          <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,4,6,.3),rgba(12,4,6,.82) 55%,rgba(8,3,4,.94))"></div>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
            <img src="bg/logo.png" style="width:184px;height:184px;border-radius:50%;box-shadow:0 0 0 15px rgba(118,185,0,.12),0 0 50px rgba(118,185,0,.5)">
            <div style="margin-top:22px;font:800 97px/1 InterD">Invisi<span style="color:var(--g)">Tech</span></div>
            <div style="margin-top:14px;font:600 45px Inter">@TheInvisiTech</div>
            <div style="display:flex;gap:70px;margin-top:28px;font:600 34px Inter"><span>👍 Like</span><span>💬 Comment</span><span>➕ Follow</span></div>
            <div style="margin-top:28px;padding:20px 76px;border-radius:60px;background:#e53935;font:700 48px Inter;box-shadow:0 0 30px rgba(229,57,53,.55)">Subscribe</div></div></div>`);
        sub('Follow InvisiTech for more.'); },
};
scenes[S]();
if (S !== 11) html(`<div class="wm"><img src="bg/logo.png"><span>@TheInvisiTech</span></div>`);
html(`<div class="scn">Scene ${S}</div>`);
if (ZONES) html(`<div class="zones">${[[220, 'title 220'], [450, 'subject 450'], [1250, 'subs 1250'], [1450, '1450'], [1500, 'UI 1500+']].map(([y, t]) => `<div class="z" style="top:${y}px">${t}</div>`).join('')}<div style="position:absolute;left:940px;top:1100px;right:0;bottom:0;background:rgba(255,0,0,.15)"></div></div>`);
</script></body></html>
